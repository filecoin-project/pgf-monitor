# IPNI is the content-routing layer: it indexes provider advertisements so retrieval clients
# can find which provider holds a CID. This manifest tracks provider breadth, ad-chain ingestion
# liveness, the error-free ratio, and indexer readiness.
#
# Appendix reconciliation 2026-08-18: the error-free ratio matches its signed bar exactly; the
# other three are measured and not scored. Detail in contracts/oif-ipni.facts.yaml.
team: oif-ipni
maintainers: ["@TODO-github-handle"]   # team fills in (Open Impact Foundation / github.com/ipni)
functions:
  # These three functions all read the same cid.contact/providers payload with different
  # metrics: breadth (provider count), liveness (ad-chain ingestion), and correctness
  # (error-free ratio).

  # THRESHOLD (placeholder, confirm with team): 100 flags a ~25% collapse of the indexed
  # provider set without flapping on routine churn.
  - function_id: content-routing-ipni-provider-count
    kernel_id: content-routing-ads
    origin: oso
    tier: essential
    category: 'Storage Market Middleware'
    sub_category: 'Content routing'
    funded_project_oso_slug: ipni
    grant_ref: APP-O66TN87V-3MDZFT
    sla:
      statement: "Breadth of the IPNI provider set: providers listed on cid.contact, measured daily"
      metric: ipni_provider_count
      cadence: daily
      unscored_reason: no-signed-bar
    source:
      adapter: oso
      kind: http-json
      base_url: "https://cid.contact"
      endpoint: "https://cid.contact/providers"
      query: "/providers"
    transform:
      # one row per listed provider
      sql: "SELECT CAST(COUNT(*) AS DOUBLE) FROM raw"

  # Every provider carries LastAdvertisementTime (ISO timestamp, dlt-parsed). Most listed
  # providers are long-dormant, so a RATIO threshold would be dishonest and would flap
  # whenever the registry is cleaned up. An absolute count of actively-advertising providers
  # directly evidences that ad-chain ingestion (the indexer's core job) is running.
  # THRESHOLD (placeholder, confirm with team): 15 catches an ingestion stall or mass
  # publisher outage while tolerating normal day-to-day variance.
  - function_id: content-routing-ipni-ingest-liveness
    kernel_id: content-routing-ads
    origin: oso
    tier: essential
    category: 'Storage Market Middleware'
    sub_category: 'Content routing'
    funded_project_oso_slug: ipni
    grant_ref: APP-O66TN87V-3MDZFT
    sla:
      statement: "Ad-chain ingestion liveness: providers showing a LastAdvertisementTime within the past 24h, measured daily"
      metric: ipni_providers_advertised_24h
      cadence: daily
      unscored_reason: no-signed-bar
    source:
      adapter: oso
      kind: http-json
      base_url: "https://cid.contact"
      endpoint: "https://cid.contact/providers"
      query: "/providers"
    transform:
      # LastAdvertisementTime is an ISO timestamptz column after dlt normalization
      sql: "SELECT CAST(COUNT(*) AS DOUBLE) FROM raw WHERE last_advertisement_time >= :now_tz - INTERVAL '1' DAY"

  # Correctness axis: providers report no LastError.
  - function_id: content-routing-ipni
    kernel_id: content-routing-ads
    origin: oso
    tier: essential
    category: 'Storage Market Middleware'
    sub_category: 'Content routing'
    funded_project_oso_slug: ipni
    grant_ref: APP-O66TN87V-3MDZFT
    sla:
      statement: "IPNI providers error-free: >= 90% of providers report no LastError, measured daily"
      metric: ipni_error_free_ratio
      # 0.90 is the threshold in the SIGNED Appendix 1 §3 (agreement doc 1LSw0hk1…, 2026-08-12).
      # This manifest previously carried 0.95, which the recipient never agreed to.
      threshold: { op: ">=", value: 0.90 }
      cadence: daily
    source:
      adapter: oso
      kind: http-json
      base_url: "https://cid.contact"
      endpoint: "https://cid.contact/providers"
      query: "/providers"
      extract: { column: last_error, reduce: null_ratio, derive: value, unit: ratio }

  # Adopted 2026-08-18 from the requested-additions block of IPNI's signed s3. That block records
  # the reason it could not be measured as "cid.contact/health returns a plain string, not valid
  # JSON" -- which is NO LONGER TRUE.
  # PROBED 2026-08-18: GET https://cid.contact/health -> HTTP 200, content-type application/json,
  #   body {"status":"ready"}. A single flat object, so data_selector "$" lands one row with a
  #   `status` column.
  # `status` is a STRING, and the pipeline needs a number, so this uses a transform rather than
  #   extract: CASE yields 1 for ready and 0 for anything else. Single SELECT, single scalar, one
  #   bound `raw` table -- inside the structural exfiltration guard.
  - function_id: content-routing-ipni-readiness
    kernel_id: content-routing-ads
    origin: karma
    tier: essential
    category: 'Storage Market Middleware'
    sub_category: 'Content routing'
    funded_project_oso_slug: ipni
    grant_ref: APP-O66TN87V-3MDZFT
    sla:
      statement: "The IPNI indexer reports itself ready on its own health endpoint (1 when status is 'ready', else 0), measured daily — the readiness signal the committee asked for and cid.contact now serves as JSON"
      metric: ipni_indexer_ready
      cadence: daily
      unscored_reason: no-signed-bar
    source:
      adapter: oso
      kind: http-json
      base_url: "https://cid.contact"
      endpoint: "https://cid.contact/health"
      query: "/health"
      data_selector: "$"
    transform:
      sql: "SELECT CASE WHEN MAX(status) = 'ready' THEN 1 ELSE 0 END FROM raw"
