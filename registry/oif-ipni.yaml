# IPNI (github.com/ipni), stewarded by the Open Impact Foundation, is the content-routing index
# cid.contact serves. This manifest tracks that the indexer stays live and ingesting: a broad
# provider set, active ad-chain ingestion, and error-free provider reporting.
team: oif-ipni
maintainers: ["@TODO-github-handle"]   # team fills in (Open Impact Foundation / github.com/ipni)
functions:
  # These three functions all read the same cid.contact/providers payload with different
  # metrics: breadth (provider count), liveness (ad-chain ingestion), and correctness
  # (error-free ratio).

  # THRESHOLD (placeholder, confirm with team): 100 flags a ~25% collapse of the indexed
  # provider set without flapping on routine churn.
  - function_id: content-routing-ipni-provider-count
    kernel_id: content-routing-ads
    origin: oso
    tier: essential
    category: 'Storage Market Middleware'
    sub_category: 'Content routing'
    funded_project_oso_slug: ipni
    sla:
      statement: "IPNI keeps a broad provider set indexed: >= 100 providers listed on cid.contact, measured daily"
      metric: ipni_provider_count
      threshold: { op: ">=", value: 100 }
      cadence: daily
    source:
      adapter: oso
      kind: http-json
      base_url: "https://cid.contact"
      endpoint: "https://cid.contact/providers"
      query: "/providers"
    transform:
      # one row per listed provider
      sql: "SELECT CAST(COUNT(*) AS DOUBLE) FROM raw"

  # Every provider carries LastAdvertisementTime (ISO timestamp, dlt-parsed). Most listed
  # providers are long-dormant, so a RATIO threshold would be dishonest and would flap
  # whenever the registry is cleaned up. An absolute count of actively-advertising providers
  # directly evidences that ad-chain ingestion (the indexer's core job) is running.
  # THRESHOLD (placeholder, confirm with team): 15 catches an ingestion stall or mass
  # publisher outage while tolerating normal day-to-day variance.
  - function_id: content-routing-ipni-ingest-liveness
    kernel_id: content-routing-ads
    origin: oso
    tier: essential
    category: 'Storage Market Middleware'
    sub_category: 'Content routing'
    funded_project_oso_slug: ipni
    sla:
      statement: "Ad-chain ingestion is live: >= 15 providers show a LastAdvertisementTime within the past 24h, measured daily"
      metric: ipni_providers_advertised_24h
      threshold: { op: ">=", value: 15 }
      cadence: daily
    source:
      adapter: oso
      kind: http-json
      base_url: "https://cid.contact"
      endpoint: "https://cid.contact/providers"
      query: "/providers"
    transform:
      # LastAdvertisementTime is an ISO timestamptz column after dlt normalization
      sql: "SELECT CAST(COUNT(*) AS DOUBLE) FROM raw WHERE last_advertisement_time >= :now_tz - INTERVAL '1' DAY"

  # Correctness axis: providers report no LastError.
  - function_id: content-routing-ipni
    kernel_id: content-routing-ads
    origin: oso
    tier: essential
    category: 'Storage Market Middleware'
    sub_category: 'Content routing'
    funded_project_oso_slug: ipni
    sla:
      statement: "IPNI providers error-free: >= 90% of providers report no LastError, measured daily"
      metric: ipni_error_free_ratio
      # 0.90 is the threshold in the SIGNED Appendix 1 §3 (agreement doc 1LSw0hk1…, 2026-08-12).
      # This manifest previously carried 0.95, which the recipient never agreed to.
      threshold: { op: ">=", value: 0.90 }
      cadence: daily
    source:
      adapter: oso
      kind: http-json
      base_url: "https://cid.contact"
      endpoint: "https://cid.contact/providers"
      query: "/providers"
      extract: { column: last_error, reduce: null_ratio, derive: value, unit: ratio }
