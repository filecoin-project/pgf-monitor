# Covers the ESSENTIAL chain ETL/indexing function (Lily: chain ETL, indexing, normalization
# & parameter matching feeding the BigQuery public dataset and the Spacescope API).
# Historical stewards are the Lily/Sentinel team and Spacescope (Starboard).
#
# The live data surfaces (Spacescope API, BigQuery dataset) cannot be probed without
# auth/BigQuery tooling, so this manifest tracks repo maintenance as a proxy signal; the
# committee should prioritize provisioning access to one of the real data surfaces, since
# repo activity alone does not evidence the pipeline actually producing fresh data.
team: lily
maintainers: ["@TODO-github-handle"]   # team fills in
functions:
  # Maintenance signal for the ETL codebase itself. This evidences the software function
  # (indexing/normalization logic tracking network upgrades), not data freshness.
  # NOTE: dlt flattens the nested GitHub payload; commit.committer.date lands as column
  #   commit__committer__date.
  # THRESHOLD (placeholder, confirm with team): <= 90 days flags an abandoned indexer
  # (which breaks on the next network upgrade) while tolerating quiet inter-upgrade periods.
  - function_id: lily-etl-maintenance
    kernel_function: "Chain ETL, indexing, normalization & parameter matching (BigQuery, Spacescope API)"
    origin: oso
    tier: essential
    category: 'Coordination & Incentives'
    sub_category: 'Network data & monitoring'
    oso_project_slug: starboard-ventures   # TODO: confirm — funding model lists Starboard as Lily steward
    sla:
      statement: "Lily has a commit <= 90 days old, measured monthly — the chain ETL/indexer must track network upgrades or the open datasets it feeds go stale"
      metric: lily_days_since_last_commit
      threshold: { op: "<=", value: 90 }
      cadence: monthly
    source:
      adapter: oso
      kind: http-json
      base_url: "https://api.github.com"
      auth: { secret_ref: github_api_token }
      endpoint: "https://api.github.com/repos/filecoin-project/lily/commits?per_page=30"
      query: "/repos/filecoin-project/lily/commits?per_page=30"
      extract: { column: commit__committer__date, timestamp_column: commit__committer__date, cast: date, reduce: latest, derive: age_days, unit: days }
