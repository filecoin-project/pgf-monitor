# Funded scope is hosting + indexing + NV maintenance of Blockscout's OWN two Filecoin
# instances: Mainnet (chain id 314, filecoin.blockscout.com) and Calibration testnet
# (314159, filecoin-testnet.blockscout.com). This manifest probes BLOCKSCOUT's own
# instances directly so explorer redundancy and the FEVM-developer surface (contract
# read/write, verified sources) are evidenced independently of other explorers.
#
# APPENDIX STATUS (checked 2026-08-15, agreement doc 1dotjw_i…, mod 2026-08-10): the signed
# §3 lists these two health endpoints as SOURCES but carries NO metric names, thresholds or
# cadences — the team replaced §3 with bare URLs. The <= 3600s bars below are OURS, not
# theirs, and were never agreed. Treat as PLACEHOLDER pending confirmation at check-in.
# `mainnet-block-explorer` additionally reads filfox.info, a third party Blockscout does not
# operate and cannot keep public under §2 (though the Funded list does name that metric for
# them). See docs/reconciliation-2026-08-15.md.
team: blockscout
maintainers: ["@TODO-github-handle"]   # team fills in
functions:
  # Blockscout's own Filecoin MAINNET instance keeps pace with the chain — the FEVM
  # developer explorer (contract read/write, verified sources). Independent of other,
  # Filfox-based explorer-freshness checks elsewhere in the registry.
  # SOURCE: /api/health, the endpoint the team nominated in their signed appendix §3
  #   (2026-07-27). It carries the same head timestamp as the old
  #   /api/v2/main-page/blocks entry plus a `healthy` boolean and the node-vs-db block
  #   delta, and it answers `cache-control: max-age=0, private` / cf-cache-status
  #   DYNAMIC — so the CDN-cache caveat that forced the loose threshold below no longer
  #   applies. data_selector pins the db sub-object so `timestamp` lands as a column.
  # PROBED 2026-07-31: curl https://filecoin.blockscout.com/api/health -> 200,
  #   healthy=true, db block 6240083 == node block 6240083 (0 delta),
  #   metadata.blocks.latest_block.db.timestamp = 2026-07-31T14:41:30Z -> head age 104s.
  #   Response headers confirm no CDN tier: cache-control: max-age=0, private,
  #   must-revalidate / cf-cache-status: DYNAMIC.
  # THRESHOLD (placeholder, confirm with team): <= 3600s (60 min) was sized to tolerate
  #   a CDN cache tier that this endpoint doesn't have, so it is now ~35x looser than the
  #   observed head age. DELIBERATELY NOT tightened here: one probe is not a distribution,
  #   and the Filfox explorer SLA already taught us that a 90s bound flaps when indexing
  #   lag runs 60-100s — the same band this sits in. Tighten from accrued
  #   data/observations.csv readings; 300s (10 epochs) is the obvious first step.
  - function_id: fevm-mainnet-explorer-blockscout
    kernel_id: mainnet-explorer
    origin: oso
    tier: essential
    category: 'UX/DX'
    sub_category: 'Explorers and Tooling'
    funded_project_oso_slug: blockscout
    sla:
      statement: "Blockscout Filecoin mainnet explorer indexes at chain head: newest indexed block <= 3600s old, measured daily — a stale explorer is not an observability surface"
      metric: blockscout_mainnet_head_age_seconds
      threshold: { op: "<=", value: 3600 }
      cadence: daily
    source:
      adapter: oso
      kind: http-json
      base_url: "https://filecoin.blockscout.com"
      endpoint: "https://filecoin.blockscout.com/api/health"
      query: "/api/health"
      data_selector: "metadata.blocks.latest_block.db"
      extract: { column: timestamp, timestamp_column: timestamp, cast: date, reduce: latest, derive: age_seconds, unit: seconds }

  # Blockscout's CALIBRATION instance — at least one calibnet explorer is wanted, and this
  # bid explicitly funds the 314159 instance. Same freshness construction as mainnet.
  # (filecoin-testnet is the live hostname; filecoin-calibration/calibration variants don't
  # resolve.)
  # SOURCE: /api/health, per the team's appendix §3 (2026-07-27) — see the mainnet note.
  # PROBED 2026-07-31: curl https://filecoin-testnet.blockscout.com/api/health -> 200,
  #   healthy=true, db block 3939419 == node block 3939419 (0 delta),
  #   timestamp = 2026-07-31T14:42:30Z -> head age 45s; same uncached headers as mainnet.
  # THRESHOLD (placeholder, confirm with team): <= 3600s, same as mainnet and equally
  #   loose; tighten both together once observations accrue.
  - function_id: calibnet-explorer-blockscout
    kernel_id: calibnet-explorer
    origin: oso
    tier: essential
    category: 'Coordination & Hardening'
    sub_category: 'Testnets - explorer'
    funded_project_oso_slug: blockscout
    sla:
      statement: "Blockscout Calibration testnet explorer indexes at chain head: newest indexed block <= 3600s old, measured daily — upgrade rehearsal needs a working explorer to analyse"
      metric: blockscout_calibnet_head_age_seconds
      threshold: { op: "<=", value: 3600 }
      cadence: daily
    source:
      adapter: oso
      kind: http-json
      base_url: "https://filecoin-testnet.blockscout.com"
      endpoint: "https://filecoin-testnet.blockscout.com/api/health"
      query: "/api/health"
      data_selector: "metadata.blocks.latest_block.db"
      extract: { column: timestamp, timestamp_column: timestamp, cast: date, reduce: latest, derive: age_seconds, unit: seconds }

  # DROPPED 2026-07-29: fevm-verified-contracts (verified_smart_contracts >= 985 weekly,
  # from /api/v2/smart-contracts/counters). It originated in Blockscout's own Karma
  # application (3.2 Verification metrics, "2x increase over the year"), but the team
  # removed it when they rewrote appendix §3 on 2026-07-27, and ProPGF is not pressing it.
  # Contract verification (Solidity + Vyper) remains a funded Exhibit A workstream — it is
  # simply not a monitored commitment. Restore from git history if the team re-proposes it.

  # Independent reference metric: explorer freshness via Filfox, complementing the
  # Blockscout-native checks above with a second, independently-operated data source.
  - function_id: mainnet-block-explorer
    kernel_id: mainnet-explorer
    origin: oso
    tier: essential
    category: 'UX/DX'
    sub_category: 'Explorers and Tooling'
    funded_project_oso_slug: filfox
    sla:
      statement: "Explorer keeps pace with the chain: the largest gap between consecutive indexed tipsets stays <= 90s (3 epochs), measured daily"
      metric: explorer_max_tipset_gap_seconds
      threshold: { op: "<=", value: 90 }
      cadence: daily
    source:
      adapter: oso
      kind: http-json
      base_url: "https://filfox.info"
      endpoint: "https://filfox.info/api/v1/tipset/recent"
      query: "/api/v1/tipset/recent"
    transform:
      # Largest gap between consecutive indexed tipsets (window LAG). A fetch-timing-robust
      # stall detector: it stays ~30s (one epoch) while the explorer keeps pace and only spikes
      # on a genuine indexing stall. Replaces the instantaneous head-age extract, which flapped
      # around the threshold because it also captured 0-30s of fetch-timing noise.
      sql: "SELECT MAX(g) FROM (SELECT timestamp - LAG(timestamp) OVER (ORDER BY height) AS g FROM raw) s"
