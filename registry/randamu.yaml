# Randamu operates the drand distributed randomness beacon and its HTTP/gossipsub relay
# network. Filecoin consensus reads beacon entries for leader election and block validation.
#
# Appendix reconciliation 2026-08-18: the best-aligned manifest in the batch -- five of five
# metrics match the signed s3, and four bars are confirmed by it. The status-page bar is unscored
# because the document contradicts itself. Detail in contracts/randamu.facts.yaml.
team: randamu
maintainers: ["@TODO-github-handle"]   # team fills in
functions:
  # Independent relay liveness: watches a second League of Entropy HTTP relay so a primary-relay
  # outage and a distribution outage are distinguishable — multi-relay reachability is the point.
  # THRESHOLD (placeholder, confirm with team): <= 2 rounds allows one round of propagation slack
  # on a mirror (60s at the 30s beacon period), vs <= 1 on the primary relay.
  - function_id: drand-relay-mirror-liveness
    kernel_id: randomness-relays
    origin: oso
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Randomness'
    funded_project_oso_slug: drand
    grant_ref: APP-KOZT1PS1-T25XTE
    sla:
      statement: "An independent drand HTTP relay (Cloudflare) stays in sync: expected - current <= 2 rounds, measured daily — randomness must be reachable even if the primary relay fails"
      metric: relay_mirror_round_lag
      unscored_reason: contract-not-executed
      cadence: daily
    source:
      adapter: oso
      kind: http-json
      base_url: "https://drand.cloudflare.com"
      endpoint: "https://drand.cloudflare.com/health"
      query: "/health"
      extract: { column: expected, column2: current, reduce: single, derive: diff, unit: rounds }

  # Wall-clock relay freshness on a Randamu-operated mirror (the 3s quicknet chain). Unlike
  # /health this does not trust the relay's self-reported "expected": the expected round is
  # computed from committed chain constants (genesis, 3s period) against the wall clock, so a
  # relay serving stale rounds cannot self-certify as healthy.
  # THRESHOLD (placeholder, confirm with team): <= 20 rounds (60s on the 3s chain) tolerates
  # fetch-vs-transform timing noise while still failing any relay more than a minute stale.
  - function_id: drand-relay-quicknet-freshness
    kernel_id: randomness-relays
    origin: oso
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Randomness'
    funded_project_oso_slug: drand
    grant_ref: APP-KOZT1PS1-T25XTE
    sla:
      statement: "Randamu relay mirror serves fresh quicknet rounds: wall-clock expected round minus served round <= 20 rounds (60s), measured daily"
      metric: relay_quicknet_round_lag
      unscored_reason: contract-not-executed
      cadence: daily
    source:
      adapter: oso
      kind: http-json
      base_url: "https://api3.drand.sh"
      endpoint: "https://api3.drand.sh/v2/beacons/quicknet/rounds/latest"
      query: "/v2/beacons/quicknet/rounds/latest"
    transform:
      # expected quicknet round from chain constants (genesis 1692803367, period 3s) at :now_tz,
      # minus the round the relay actually serves; 0 when fresh
      sql: "SELECT GREATEST(0, FLOOR((to_unixtime(:now_tz) - 1692803367) / 3.0) + 1 - MAX(CAST(round AS DOUBLE))) FROM raw"

  # The randomness beacon itself: lag on the primary drand relay's beacon (the irreplaceable
  # randomness function that Filecoin leader election and block validation depend on).
  - function_id: randomness-beacon
    kernel_id: distributed-randomness-beacon
    origin: oso
    tier: irreplaceable
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Randomness'
    funded_project_oso_slug: drand
    grant_ref: APP-KOZT1PS1-T25XTE
    sla:
      statement: "drand beacon relay not lagging: expected - current <= 1 round, measured daily"
      metric: beacon_round_lag
      unscored_reason: contract-not-executed
      cadence: daily
    source:
      adapter: oso
      kind: http-json
      base_url: "https://api.drand.sh"
      endpoint: "https://api.drand.sh/health"
      query: "/health"
      extract: { column: expected, column2: current, reduce: single, derive: diff, unit: rounds }

  # Operator-reported relay health from drand's own status page (status.drand.love). Complements
  # the independent relay checks above and gives the public tracker its incident history.
  # data_selector pins the root status object so the fetch doesn't descend into the nested arrays.
  # THRESHOLD (placeholder, confirm with team): indicator maps none -> 0, minor/major/critical -> 1.
  - function_id: drand-relay-statuspage
    kernel_id: randomness-relays
    origin: oso
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Randomness'
    funded_project_oso_slug: drand
    grant_ref: APP-KOZT1PS1-T25XTE
    sla:
      statement: "drand's own status-page incident indicator, measured daily — the operator-reported health of the HTTP relay network Filecoin SPs consume randomness from"
      metric: statuspage_impact_level
      cadence: daily
      unscored_reason: doc-conflict
    source:
      adapter: oso
      kind: http-json
      base_url: "https://drand.statuspage.io"
      endpoint: "https://drand.statuspage.io/api/v2/summary.json"
      query: "/api/v2/summary.json"
      data_selector: status
    transform:
      sql: "SELECT MAX(CASE WHEN indicator = 'none' THEN 0 ELSE 1 END) FROM raw"

  # Software-stack release cadence for drand itself (the team named GitHub releases as its
  # verification method) — evidences that the software ships upgrades, complementary to the
  # relay and beacon liveness checks above.
  # THRESHOLD (placeholder, confirm with team): <= 45 days average between releases as a starting
  # point, pending the team's committed cadence.
  - function_id: drand-release-cadence
    kernel_id: randomness-relays
    origin: karma
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Randomness'
    funded_project_oso_slug: drand
    grant_ref: APP-KOZT1PS1-T25XTE
    repos:
      - drand/drand
    sla:
      statement: "drand ships a software-stack release at least every 45 days on average (active-maintenance signal), measured monthly"
      metric: avg_days_between_releases
      unscored_reason: contract-not-executed
      cadence: monthly
    source:
      adapter: oso
      kind: http-json
      base_url: "https://api.github.com"
      auth: { secret_ref: GH_API_TOKEN }
      endpoint: "https://api.github.com/repos/drand/drand/releases"
      query: "/repos/drand/drand/releases?per_page=30"
    transform:
      # avg days between consecutive releases; a rich cadence metric the extract vocab cannot express
      sql: "SELECT date_diff('second', MIN(published_at), MAX(published_at)) / NULLIF(COUNT(*) - 1, 0) / 86400.0 FROM raw"
