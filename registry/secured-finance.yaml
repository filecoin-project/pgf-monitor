# Secured Finance operates USDFC, an overcollateralized stablecoin on FVM, and the
# settlement rails that price paid storage in a stable unit. This manifest tracks the
# USDFC-axlUSDC pool's depth and trading flow on GeckoTerminal.
#
# Both entries are measured and NOT scored: the agreement places liquidity provision outside this
# grant's scope, so a depth bar would score the recipient on capital they do not supply.
# Detail in contracts/secured-finance.facts.yaml (maintainer-local).
team: secured-finance
maintainers: ["@TODO-github-handle"]   # team fills in
functions:
  # ---------------------------------------------------------------------------
  # USDFC–axlUSDC liquidity pool metrics. Borrowed triple — see HONESTY NOTE in the
  # header. Source: GeckoTerminal Filecoin pools list. Same is-USDFC-alive-and-liquid
  # family as the collateral-TVL / peg-stability entries, one level lower (DEX pool
  # depth + flow rather than protocol collateral + peg).
  #
  # data_selector: data lands ONE ROW PER POOL in the parent table; each pool's
  #   `attributes` object flattens to attributes__<field> columns (nested OBJECTS, not
  #   arrays, so no unreachable child table). The USDFC/axlUSDC pool is
  #   attributes__address = '0x21ca72fe39095db9642ca9cc694fa056f906037f'
  #   (name "USDFC / axlUSDC 0.01%"). A transform filters to that one row by address — the
  #   extract vocab has no WHERE, so a transform (not extract) is required to isolate the pool.
  # ---------------------------------------------------------------------------

  # UNSCORED as out-of-scope: the pool-depth figure this once scored against appears in the
  #   signed appendix only as a tier for READING the peg band, never as a bar to clear, and the
  #   agreement places liquidity provision outside this grant. reserve_in_usd is still measured --
  #   it is the honest evidence that USDFC is liquid. See contracts/secured-finance.facts.yaml.
  - function_id: usdfc-axlusdc-pool-tvl
    kernel_id: stablecoin-settlement
    origin: karma
    tier: important
    category: 'UX/DX'
    sub_category: 'Stablecoin & yield'
    funded_project_oso_slug: secured-finance
    grant_ref: APP-Z1L7URG7-TJ3G5D
    sla:
      statement: "USDFC–axlUSDC pool depth: GeckoTerminal reserve_in_usd, measured weekly. Reported for context — the agreement places liquidity provision outside this grant's scope"
      metric: usdfc_pool_tvl_usd
      cadence: weekly
      unscored_reason: out-of-scope
    source:
      adapter: oso
      kind: http-json
      base_url: "https://api.geckoterminal.com"
      endpoint: "https://api.geckoterminal.com/api/v2/networks/filecoin/pools"
      query: "/api/v2/networks/filecoin/pools"
      data_selector: data
    transform:
      # total value locked (USD) of the one USDFC/axlUSDC pool, isolated by address; single parent row
      sql: "SELECT MAX(CAST(attributes__reserve_in_usd AS DOUBLE)) FROM raw WHERE attributes__address = '0x21ca72fe39095db9642ca9cc694fa056f906037f'"

  # THRESHOLD (placeholder, confirm with team): the team's application commits to pool
  #   liquidity/depth but does not state a specific 24h-volume floor. 1,000 USD/24h is a
  #   placeholder is-it-trading floor. volume_usd.h24 is the rolling 24-hour trade volume
  #   in USD, which dlt flattens to attributes__volume_usd__h24.
  - function_id: usdfc-axlusdc-pool-volume
    kernel_id: stablecoin-settlement
    origin: karma
    tier: important
    category: 'UX/DX'
    sub_category: 'Stablecoin & yield'
    funded_project_oso_slug: secured-finance
    grant_ref: APP-Z1L7URG7-TJ3G5D
    sla:
      statement: "USDFC–axlUSDC pool trading flow: GeckoTerminal 24h volume_usd, measured daily. Reported for context — the team commits to publishing this figure, not to reaching a level"
      metric: usdfc_pool_volume_usd
      cadence: daily
      unscored_reason: out-of-scope
    source:
      adapter: oso
      kind: http-json
      base_url: "https://api.geckoterminal.com"
      endpoint: "https://api.geckoterminal.com/api/v2/networks/filecoin/pools"
      query: "/api/v2/networks/filecoin/pools"
      data_selector: data
    transform:
      # 24h trading volume (USD) of the one USDFC/axlUSDC pool, isolated by address; single parent row
      sql: "SELECT MAX(CAST(attributes__volume_usd__h24 AS DOUBLE)) FROM raw WHERE attributes__address = '0x21ca72fe39095db9642ca9cc694fa056f906037f'"
