# Secured Finance's USDFC stablecoin: this manifest tracks the USDFC–axlUSDC liquidity
# pool's TVL and 24h trading volume on GeckoTerminal.
#
# HONESTY NOTE: _kernel.yaml catalogues no stablecoin/DeFi/liquidity function. The entries
# below borrow the ONE defensible catalogued triple — essential / 'Coordination &
# Incentives' / 'Network data & monitoring'. They evidence that USDFC has LIVE on-chain
# liquidity (depth + flow) — they do NOT evidence a kernel function, because none is
# catalogued. Informational input to the reject-vs-fund decision until the committee
# catalogues (or declines) a DeFi/liquidity function, at which point these get re-homed
# under the real triple.
#
# APPENDIX STATUS (checked 2026-08-15): the signed §3 (agreement doc 1YzUQqPK…, mod
# 2026-08-03) matches this manifest exactly, so there is no drift — but read Exhibit A before
# adjudicating a breach. The Work Plan states: "Liquidity capital itself is explicitly not
# part of this request; it is being arranged separately with PL-FIF." The grant funds
# onboarding docs, Squid integration support, and MEASUREMENT/REPORTING of settlement depth —
# not provision of it. Both thresholds are still marked "(to confirm)" in the signed document
# and 170,000 is described there as a "Phase 1 target". Pool TVL therefore scores the
# recipient on a third party's undeployed capital. Committee call, not a registry fix.
team: secured-finance
maintainers: ["@TODO-github-handle"]   # team fills in
functions:
  # ---------------------------------------------------------------------------
  # USDFC–axlUSDC liquidity pool metrics. Borrowed triple — see HONESTY NOTE in the
  # header. Source: GeckoTerminal Filecoin pools list. Same is-USDFC-alive-and-liquid
  # family as the collateral-TVL / peg-stability entries, one level lower (DEX pool
  # depth + flow rather than protocol collateral + peg).
  #
  # data_selector: data lands ONE ROW PER POOL in the parent table; each pool's
  #   `attributes` object flattens to attributes__<field> columns (nested OBJECTS, not
  #   arrays, so no unreachable child table). The USDFC/axlUSDC pool is
  #   attributes__address = '0x21ca72fe39095db9642ca9cc694fa056f906037f'
  #   (name "USDFC / axlUSDC 0.01%"). A transform filters to that one row by address — the
  #   extract vocab has no WHERE, so a transform (not extract) is required to isolate the pool.
  # ---------------------------------------------------------------------------

  # THRESHOLD/POOL (placeholder, confirm with team): the team committed pool TVL
  #   >= $170,000 (Phase 1); Phase 2 target is $300,000. Value below is set to the Phase 1
  #   figure BUT is a placeholder: the only pool literally named USDFC/axlUSDC has
  #   observed depth well below that target, so the team must confirm the intended pool
  #   address before this threshold is meaningful. reserve_in_usd is the pool's total
  #   value locked in USD.
  - function_id: usdfc-axlusdc-pool-tvl
    kernel_id: open-network-datasets
    origin: karma
    tier: essential
    category: 'Coordination & Incentives'
    sub_category: 'Network data & monitoring'
    funded_project_oso_slug: secured-finance
    sla:
      statement: "The USDFC–axlUSDC liquidity pool holds meaningful depth: GeckoTerminal reserve_in_usd >= 170,000 USD (Phase 1 target; Phase 2 300,000), measured weekly — thin pool liquidity means USDFC cannot be traded at scale"
      metric: usdfc_pool_tvl_usd
      threshold: { op: ">=", value: 170000 }   # PLACEHOLDER — confirm pool address + target with team
      cadence: weekly
    source:
      adapter: oso
      kind: http-json
      base_url: "https://api.geckoterminal.com"
      endpoint: "https://api.geckoterminal.com/api/v2/networks/filecoin/pools"
      query: "/api/v2/networks/filecoin/pools"
      data_selector: data
    transform:
      # total value locked (USD) of the one USDFC/axlUSDC pool, isolated by address; single parent row
      sql: "SELECT MAX(CAST(attributes__reserve_in_usd AS DOUBLE)) FROM raw WHERE attributes__address = '0x21ca72fe39095db9642ca9cc694fa056f906037f'"

  # THRESHOLD (placeholder, confirm with team): the team's application commits to pool
  #   liquidity/depth but does not state a specific 24h-volume floor. 1,000 USD/24h is a
  #   placeholder is-it-trading floor. volume_usd.h24 is the rolling 24-hour trade volume
  #   in USD, which dlt flattens to attributes__volume_usd__h24.
  - function_id: usdfc-axlusdc-pool-volume
    kernel_id: open-network-datasets
    origin: karma
    tier: essential
    category: 'Coordination & Incentives'
    sub_category: 'Network data & monitoring'
    funded_project_oso_slug: secured-finance
    sla:
      statement: "The USDFC–axlUSDC pool sees real trading flow: GeckoTerminal 24h volume_usd >= 1,000 USD, measured daily — a pool with liquidity but no volume is not serving swaps"
      metric: usdfc_pool_volume_usd
      threshold: { op: ">=", value: 1000 }   # PLACEHOLDER — no committed volume floor; confirm with team
      cadence: daily
    source:
      adapter: oso
      kind: http-json
      base_url: "https://api.geckoterminal.com"
      endpoint: "https://api.geckoterminal.com/api/v2/networks/filecoin/pools"
      query: "/api/v2/networks/filecoin/pools"
      data_selector: data
    transform:
      # 24h trading volume (USD) of the one USDFC/axlUSDC pool, isolated by address; single parent row
      sql: "SELECT MAX(CAST(attributes__volume_usd__h24 AS DOUBLE)) FROM raw WHERE attributes__address = '0x21ca72fe39095db9642ca9cc694fa056f906037f'"
