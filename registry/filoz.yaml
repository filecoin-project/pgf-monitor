# FilOz maintains Curio, the SP sealing/proving/PDP stack. This manifest tracks Curio's
# release cadence, its WindowPoSt/WinningPoSt scheduler, and PDP proof sets on mainnet.
#
# Appendix reconciliation 2026-08-18: all three thresholds are marked "(to confirm)" in the
# signed s3, so all three are measured and not scored. Detail in contracts/filoz.facts.yaml.
team: filoz
maintainers: ["@TODO-github-handle"]   # team fills in
functions:
  # ---------------------------------------------------------------------------
  # CURIO — canonical repo filecoin-project/curio
  # ---------------------------------------------------------------------------

  # Maintenance-cadence proxy for the sealing pipeline; live sealing evidence (daily sector
  # onboarding) needs an authenticated source, not yet available.
  # THRESHOLD (placeholder, confirm with team): ~25d observed avg release cadence; 45 leaves
  # ~2x headroom.
  - function_id: curio-sealing-release-cadence
    kernel_id: sealing-pipeline
    origin: oso
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Block Production (mining)'
    funded_project_oso_slug: filozone
    grant_ref: APP-HDYJESMD-2WLL00
    repos:
      - filecoin-project/curio
    sla:
      statement: "Curio release cadence: average days between releases (a sealing-pipeline maintenance signal), measured monthly"
      metric: avg_days_between_releases
      cadence: monthly
      unscored_reason: no-signed-bar
    source:
      adapter: oso
      kind: http-json
      base_url: "https://api.github.com"
      auth: { secret_ref: GH_API_TOKEN }
      endpoint: "https://api.github.com/repos/filecoin-project/curio/releases?per_page=30"
      query: "/repos/filecoin-project/curio/releases?per_page=30"
    transform:
      # avg days between consecutive releases (same pattern as forest-release-cadence)
      sql: "SELECT date_diff('second', MIN(published_at), MAX(published_at)) / NULLIF(COUNT(*) - 1, 0) / 86400.0 FROM raw"

  # Network-wide win-count health — a joint signal across Curio + lotus-miner fleets, not
  # attributable to Curio alone.
  # filfox /api/v1/tipset/recent nests per-tipset "blocks" as an array landing in a child
  # table transforms can't reach — hence the precomputed average from /overview.
  # THRESHOLD (placeholder, confirm with team): observed ~4.94 avg; sustained < 4.5 means
  # elected winners are failing to submit blocks (WinningPoSt/scheduler trouble across the SP
  # fleet).
  - function_id: curio-windowpost-winningpost-scheduler
    kernel_id: proving-scheduler
    origin: oso
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Block Production (mining)'
    funded_project_oso_slug: filozone
    grant_ref: APP-HDYJESMD-2WLL00
    sla:
      statement: "Win-count health: network average blocks per tipset, of 5 expected, measured daily — a network-wide reading rather than a Curio-specific one"
      metric: avg_blocks_per_tipset
      cadence: daily
      unscored_reason: no-signed-bar
    source:
      adapter: oso
      # CAVEAT: filfox 403s the default python-requests User-Agent on /overview (any other
      # UA passes); fallback is a UA header or a different host.
      kind: http-json
      base_url: "https://filfox.info"
      endpoint: "https://filfox.info/api/v1/overview"
      query: "/api/v1/overview"
      extract: { column: average_tipset_blocks, reduce: single, derive: value, unit: blocks }

  # Public Goldsky subgraph behind FilOzone's own PDP explorer (pdp.vxb.ai / github.com/FilOzone/pdp-explorer).
  # Single-object GraphQL query on purpose — a list response would land in a child table.
  # Column name assumes dlt's snake_case flattening of data.networkMetric.totalActiveProofSets.
  # Covers the PDP leg of the function only; the deal-making leg has no verified public source.
  # THRESHOLD (placeholder, confirm with team): observed ~1032 active proof sets; >= 500
  # asserts PDP proving stays in production at roughly half current scale.
  - function_id: curio-pdp-active-proofsets
    kernel_id: dealmaking-pdp-retrieval
    origin: oso
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Block Production (mining)'
    funded_project_oso_slug: filozone
    grant_ref: APP-HDYJESMD-2WLL00
    sla:
      statement: "PDP on mainnet: count of active proof sets, measured daily"
      metric: pdp_active_proof_sets
      cadence: daily
      unscored_reason: no-signed-bar
    source:
      adapter: oso
      kind: http-json
      base_url: "https://api.goldsky.com"
      endpoint: "https://api.goldsky.com/api/public/project_cmdfaaxeuz6us01u359yjdctw/subgraphs/pdp-explorer/mainnet311e/gn"
      query: "/api/public/project_cmdfaaxeuz6us01u359yjdctw/subgraphs/pdp-explorer/mainnet311e/gn"
      method: POST
      # literal GraphQL braces are doubled ({{ }}) — dlt's rest_api treats single
      # braces in param/json values as placeholder expressions
      params: { query: '{{ networkMetric(id: "0x7064705f6e6574776f726b5f7374617473") {{ totalActiveProofSets }} }}' }
      extract: { column: data__network_metric__total_active_proof_sets, cast: float, reduce: single, derive: value, unit: proof_sets }
