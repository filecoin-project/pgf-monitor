# FilOz spans Curio (the sealing/proving/deal-making stack, canonical repo
# filecoin-project/curio) plus its pre-existing stewardship of Lotus (consensus client),
# lotus-miner (WinningPoSt leader election / block assembly), and the EVM + EAM actors
# (co-maintained inside builtin-actors). This manifest tracks release cadence, PDP proof-set
# activity, and mainnet block-production health across that portfolio.
team: filoz
maintainers: ["@TODO-github-handle"]   # team fills in
functions:
  # ---------------------------------------------------------------------------
  # CURIO — canonical repo filecoin-project/curio
  # ---------------------------------------------------------------------------

  # Maintenance-cadence proxy for the sealing pipeline; live sealing evidence (daily sector
  # onboarding) needs an authenticated source, not yet available.
  # THRESHOLD (placeholder, confirm with team): ~25d observed avg release cadence; 45 leaves
  # ~2x headroom.
  - function_id: curio-sealing-release-cadence
    kernel_function: "Sealing pipeline (PC1/PC2/Commit, SupraSeal, Snap)"
    origin: oso
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Block Production (mining)'
    oso_project_slug: curio-filecoin-project
    sla:
      statement: "Curio ships a release at least every 45 days on average (sealing-pipeline maintenance signal), measured monthly"
      metric: avg_days_between_releases
      threshold: { op: "<=", value: 45 }
      cadence: monthly
    source:
      adapter: oso
      kind: http-json
      base_url: "https://api.github.com"
      endpoint: "https://api.github.com/repos/filecoin-project/curio/releases?per_page=30"
      query: "/repos/filecoin-project/curio/releases?per_page=30"
    transform:
      # avg days between consecutive releases (same pattern as forest-release-cadence)
      sql: "SELECT date_diff('second', MIN(published_at), MAX(published_at)) / NULLIF(COUNT(*) - 1, 0) / 86400.0 FROM raw"

  # Network-wide win-count health — a joint signal across Curio + lotus-miner fleets, not
  # attributable to Curio alone.
  # filfox /api/v1/tipset/recent nests per-tipset "blocks" as an array landing in a child
  # table transforms can't reach — hence the precomputed average from /overview.
  # THRESHOLD (placeholder, confirm with team): observed ~4.94 avg; sustained < 4.5 means
  # elected winners are failing to submit blocks (WinningPoSt/scheduler trouble across the SP
  # fleet).
  - function_id: curio-windowpost-winningpost-scheduler
    kernel_function: "Proving scheduler - WindowPoSt deadlines + WinningPoSt eligibility"
    origin: oso
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Block Production (mining)'
    oso_project_slug: curio-filecoin-project
    sla:
      statement: "Win-count health: network average blocks per tipset >= 4.5 (of 5 expected), measured daily"
      metric: avg_blocks_per_tipset
      threshold: { op: ">=", value: 4.5 }
      cadence: daily
    source:
      adapter: oso
      # CAVEAT: filfox 403s the default python-requests User-Agent on /overview (any other
      # UA passes); fallback is a UA header or a different host.
      kind: http-json
      base_url: "https://filfox.info"
      endpoint: "https://filfox.info/api/v1/overview"
      query: "/api/v1/overview"
      extract: { column: average_tipset_blocks, reduce: single, derive: value, unit: blocks }

  # Public Goldsky subgraph behind FilOzone's own PDP explorer (pdp.vxb.ai / github.com/FilOzone/pdp-explorer).
  # Single-object GraphQL query on purpose — a list response would land in a child table.
  # Column name assumes dlt's snake_case flattening of data.networkMetric.totalActiveProofSets.
  # Covers the PDP leg of the function only; the deal-making leg has no verified public source.
  # THRESHOLD (placeholder, confirm with team): observed ~1032 active proof sets; >= 500
  # asserts PDP proving stays in production at roughly half current scale.
  - function_id: curio-pdp-active-proofsets
    kernel_function: "Deal-making + PDP + HTTP retrieval"
    origin: oso
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Block Production (mining)'
    oso_project_slug: curio-filecoin-project
    sla:
      statement: "PDP live on mainnet: active proof sets >= 500, measured daily"
      metric: pdp_active_proof_sets
      threshold: { op: ">=", value: 500 }
      cadence: daily
    source:
      adapter: oso
      kind: http-json
      base_url: "https://api.goldsky.com"
      endpoint: "https://api.goldsky.com/api/public/project_cmdfaaxeuz6us01u359yjdctw/subgraphs/pdp-explorer/mainnet311e/gn"
      query: "/api/public/project_cmdfaaxeuz6us01u359yjdctw/subgraphs/pdp-explorer/mainnet311e/gn"
      method: POST
      # literal GraphQL braces are doubled ({{ }}) — dlt's rest_api treats single
      # braces in param/json values as placeholder expressions
      params: { query: '{{ networkMetric(id: "0x7064705f6e6574776f726b5f7374617473") {{ totalActiveProofSets }} }}' }
      extract: { column: data__network_metric__total_active_proof_sets, cast: float, reduce: single, derive: value, unit: proof_sets }

  # ---------------------------------------------------------------------------
  # PRE-EXISTING FilOz agreements: Lotus, lotus-miner, EVM + EAM actor — included so
  # kernel coverage is complete for the steward.
  # ---------------------------------------------------------------------------

  # GitHub feed mixes lotus and miner/* tags plus release candidates, hence the WHERE filter
  # in the transform (stable 'v*' tags only).
  # Lotus version adoption across network peers would be the ideal signal here, but no
  # public unauthenticated telemetry source was found.
  # THRESHOLD (placeholder, confirm with team): observed ~36d avg for stable releases; 60
  # leaves headroom for the between-network-upgrade lull.
  - function_id: lotus-consensus-client-release-cadence
    kernel_function: "Consensus/validation client: fork-choice, state validation, message pool"
    origin: oso
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Ledger & Consensus'
    oso_project_slug: filozone
    sla:
      statement: "Lotus ships a stable (non-RC) release at least every 60 days on average (consensus-client maintenance signal), measured monthly"
      metric: avg_days_between_stable_releases
      threshold: { op: "<=", value: 60 }
      cadence: monthly
    source:
      adapter: oso
      kind: http-json
      base_url: "https://api.github.com"
      endpoint: "https://api.github.com/repos/filecoin-project/lotus/releases?per_page=30"
      query: "/repos/filecoin-project/lotus/releases?per_page=30"
    transform:
      # stable node releases only: keep 'v*' tags, drop 'miner/*' tags and release candidates
      sql: "SELECT date_diff('second', MIN(published_at), MAX(published_at)) / NULLIF(COUNT(*) - 1, 0) / 86400.0 FROM raw WHERE tag_name LIKE 'v%' AND tag_name NOT LIKE '%-rc%'"

  # Joint fleet signal (lotus-miner + Curio + sophon-miner). lotus-miner is on a deprecation
  # path toward Curio; its 'miner/*' release tags average ~41.6d between stable releases.
  # THRESHOLD (placeholder, confirm with team): observed ~30.3s; sustained > 45s means leader
  # election / block assembly is failing network-wide (null tipsets, missed epochs). 70%+ of
  # block producers run lotus-miner, making this the closest live network signal.
  - function_id: lotus-miner-winningpost-block-production
    kernel_function: "Block production - WinningPoSt leader election & block assembly"
    origin: oso
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Block Production (mining)'
    oso_project_slug: filozone
    sla:
      statement: "Mainnet keeps its ~30s epoch cadence: average tipset interval <= 45s, measured daily"
      metric: mainnet_avg_tipset_interval_seconds
      threshold: { op: "<=", value: 45 }
      cadence: daily
    source:
      adapter: oso
      # CAVEAT: filfox /overview 403s the default python-requests User-Agent; fallback is a
      # UA header or a different host.
      kind: http-json
      base_url: "https://filfox.info"
      endpoint: "https://filfox.info/api/v1/overview"
      query: "/api/v1/overview"
      extract: { column: average_tipset_interval, reduce: single, derive: value, unit: seconds }

  # The EVM + EAM actors ship inside builtin-actors (actors/evm, actors/eam); there's no
  # separately-released artifact. This tracks release cadence — a different metric from the
  # builtin-actors release-age check below — as a signal of sustained co-maintenance (FilOz +
  # Forest + Fil-B). EVM-specific live telemetry was evaluated but no usable public source
  # was found.
  # THRESHOLD (placeholder, confirm with team): observed ~32.7d avg; 60 gives ~2x headroom.
  - function_id: evm-eam-actor-maintenance
    origin: oso
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'VM & Programmability'
    oso_project_slug: filozone
    sla:
      statement: "builtin-actors (home of the EVM + EAM actors) ships a release at least every 60 days on average, measured monthly"
      metric: avg_days_between_releases
      threshold: { op: "<=", value: 60 }
      cadence: monthly
    source:
      adapter: oso
      kind: http-json
      base_url: "https://api.github.com"
      endpoint: "https://api.github.com/repos/filecoin-project/builtin-actors/releases?per_page=30"
      query: "/repos/filecoin-project/builtin-actors/releases?per_page=30"
    transform:
      # avg days between consecutive releases (cadence, not age — see note above)
      sql: "SELECT date_diff('second', MIN(published_at), MAX(published_at)) / NULLIF(COUNT(*) - 1, 0) / 86400.0 FROM raw"

  # From the team's own Karma application: Curio Core proposed "Mainnet SPs running Curio
  # Core — on-chain ServiceProviderRegistry — target >= 3 mainnet providers." The subgraph
  # cannot attribute providers to Curio Core builds specifically (that needs
  # web3_clientVersion fingerprinting), so this tracks the network-level provider count the
  # target lives inside — attribution stays a review-time check.
  # THRESHOLD: >= 3 — the team's own Karma target as a network-level floor.
  - function_id: pdp-active-providers
    kernel_function: "Deal-making + PDP + HTTP retrieval"
    origin: karma
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Block Production (mining)'
    oso_project_slug: curio-filecoin-project
    sla:
      statement: "PDP provider base holds: total registered PDP providers >= 3 (Curio Core's Karma target names >= 3 mainnet providers), measured weekly"
      metric: pdp_total_providers
      threshold: { op: ">=", value: 3 }
      cadence: weekly
    source:
      adapter: oso
      kind: http-json
      base_url: "https://api.goldsky.com"
      endpoint: "https://api.goldsky.com/api/public/project_cmdfaaxeuz6us01u359yjdctw/subgraphs/pdp-explorer/mainnet311e/gn"
      query: "/api/public/project_cmdfaaxeuz6us01u359yjdctw/subgraphs/pdp-explorer/mainnet311e/gn"
      method: POST
      # literal GraphQL braces doubled ({{ }}) — dlt expression-parsing rule
      params: { query: '{{ networkMetric(id: "0x7064705f6e6574776f726b5f7374617473") {{ totalProviders }} }}' }
      extract: { column: data__network_metric__total_providers, cast: float, reduce: single, derive: value, unit: providers }

  # Release-age check for builtin-actors (home of the storage market / miner / power /
  # system / reward / datacap actors).
  - function_id: builtin-actors
    kernel_function: "Storage market / miner / power / system / reward / datacap actors"
    origin: oso
    tier: irreplaceable
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'VM & Programmability'
    oso_project_slug: builtin-actors
    sla:
      statement: "A tagged builtin-actors release <= 90 days old, measured monthly"
      metric: release_age_days
      threshold: { op: "<=", value: 90 }
      cadence: monthly
    source:
      adapter: oso
      kind: http-json
      base_url: "https://api.github.com"
      endpoint: "https://api.github.com/repos/filecoin-project/builtin-actors/releases"
      query: "/repos/filecoin-project/builtin-actors/releases"
      extract: { column: published_at, timestamp_column: published_at, cast: date, reduce: latest, derive: age_days, unit: days }
