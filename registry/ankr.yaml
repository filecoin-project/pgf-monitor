# public repo to verify implementation against. These metrics deliberately measure the SERVICE
# OUTPUT (public endpoint freshness) rather than the code — which is the honest thing a
# machine check can attest for a closed-source operator.
team: ankr
maintainers: ["@TODO-github-handle"]   # team fills in
# x_draft (promotion note — annotations preserved as comments):
#   slate_status: "Re-scope"
#   slate_tier: "ESS"
