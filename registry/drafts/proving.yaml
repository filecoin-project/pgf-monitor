# DRAFT — kernel coverage with NO grant behind it.
#
# Demoted from registry/proving.yaml on 2026-08-15. This manifest tracks the IRREPLACEABLE proving subsystem (rust-fil-proofs, bellperson).
# It is OSO-authored: `maintainers: ["@TODO-github-handle"]`, thresholds ours, and the team
# appears nowhere on the ProPGF Batch 3 Funded list. There is no counterparty and no signed
# Appendix 1 §3, so an SLA "breach" here breaches nothing — the readings are ecosystem
# telemetry filed in a schema whose noun is "commitment".
#
# Kept as a draft so the kernel-coverage map still shows the function is watched. Promote if
# and when a grantee signs a §3 for it. See docs/reconciliation-2026-08-15.md.
# Covers the IRREPLACEABLE proving subsystem — PoRep (StackedDRG sealing), WinningPoSt /
# WindowPoSt, and the crypto primitives underneath (BLST, bellperson, neptune). Stewardship
# sits with the rust-fil-proofs maintainers / Filecoin core teams. Release cadence on
# rust-fil-proofs is not a usable signal (last tagged GitHub release: 2019), so both metrics
# below are commit-recency maintenance signals.
#
# NETWORK-LEVEL EVIDENCE (not duplicated here): WindowPoSt is proven every day by the whole
# network — a proving regression would halt liveness proofs and block production
# network-wide, so the chain advancing on its ~30s cadence already evidences the proving
# subsystem indirectly.
team: proving
maintainers: ["@TODO-github-handle"]   # team fills in
x_draft:
  slate: "no-grant-kernel-coverage"
  provenance: "demoted from registry/proving.yaml 2026-08-15 — no counterparty, no signed §3"
  unmeasured: []
functions:
  # Maintenance signal for the proofs library every sealer/prover/verifier runs.
  # NOTE: dlt flattens the nested GitHub payload; commit.committer.date lands as column
  #   commit__committer__date. `parents` (nested array) lands in a child table — harmless here.
  # THRESHOLD (placeholder, confirm with team): repo is in slow maintenance mode, so
  # <= 120 days flags a genuinely unstaffed quarter without flapping on normal quiet periods.
  - function_id: rust-fil-proofs-maintenance
    origin: oso
    tier: irreplaceable
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Proving'
    oso_project_slug: rust-fil-proofs   # TODO: confirm OSO/oss-directory slug
    sla:
      statement: "rust-fil-proofs has a commit <= 120 days old, measured monthly — the proving library must stay staffed; a regression here halts proving network-wide"
      metric: proofs_days_since_last_commit
      threshold: { op: "<=", value: 120 }
      cadence: monthly
    source:
      adapter: oso
      kind: http-json
      base_url: "https://api.github.com"
      auth: { secret_ref: GH_API_TOKEN }
      endpoint: "https://api.github.com/repos/filecoin-project/rust-fil-proofs/commits?per_page=30"
      query: "/repos/filecoin-project/rust-fil-proofs/commits?per_page=30"
      extract: { column: commit__committer__date, timestamp_column: commit__committer__date, cast: date, reduce: latest, derive: age_days, unit: days }

  # Maintenance signal for the Groth16 prover (bellperson) under rust-fil-proofs.
  # THRESHOLD (placeholder, confirm with team): crypto primitives change rarely, so
  # <= 180 days is a stall detector, not an activity target.
  - function_id: proving-crypto-primitives-maintenance
    origin: oso
    tier: irreplaceable
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Proving'
    oso_project_slug: rust-fil-proofs   # TODO: confirm OSO/oss-directory slug
    sla:
      statement: "bellperson (Groth16 prover) has a commit <= 180 days old, measured monthly — the crypto primitives under PoRep/PoSt must remain maintained"
      metric: bellperson_days_since_last_commit
      threshold: { op: "<=", value: 180 }
      cadence: monthly
    source:
      adapter: oso
      kind: http-json
      base_url: "https://api.github.com"
      auth: { secret_ref: GH_API_TOKEN }
      endpoint: "https://api.github.com/repos/filecoin-project/bellperson/commits?per_page=30"
      query: "/repos/filecoin-project/bellperson/commits?per_page=30"
      extract: { column: commit__committer__date, timestamp_column: commit__committer__date, cast: date, reduce: latest, derive: age_days, unit: days }
