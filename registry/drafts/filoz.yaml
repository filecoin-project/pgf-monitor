# DRAFT — pre-populated by OSO (2026-07-16) for ProPGF Batch 3, Curio row.
# Stages monitoring metrics the Curio team (FilOz) committed to in their Karma
# application (APP-P3NAPR7O-TSQ67Q) that registry/filoz.yaml does not yet carry:
# the team's OWN deliverable repos (Reiers/curio-core, Reiers/lantern) rather than
# the canonical filecoin-project/curio repo already monitored in the registry.
# Promote by: (1) team adopts via PR, (2) delete/x-comment the x_draft block,
# (3) confirm PLACEHOLDER thresholds with the team, (4) add any NEW hosts to
# registry/_allowlist.txt (none required — api.github.com is already allowlisted).
team: filoz
maintainers: ["@TODO-github-handle"]   # team fills in
x_draft:
  slate_status: "Re-scope"
  app_ref: "APP-P3NAPR7O-TSQ67Q"
  prepared_by: "OSO, 2026-07-16"
  # api.github.com is already on registry/_allowlist.txt — list NEW hosts only.
  allowlist_additions: []
  candidates:
    - metric: usdfc_settled_via_filecoinpay_settlerail
      why_unverified: >-
        The Karma app commits to USDFC payments settling through FilecoinPay's
        settleRail path, but there is no clean public JSON endpoint for it. The
        signal lives in FilecoinPay contract events (SettleRail / rail settlement)
        and would need a subgraph query (a Goldsky/other GraphQL endpoint indexing
        the FilecoinPay rails) before it can become an http-json function. Flag for
        committee: identify or provision a public FilecoinPay subgraph, then add its
        host here and stage a POST GraphQL function (see filoz curio-pdp-* entries
        for the doubled-brace GraphQL pattern).
functions:
  # ---------------------------------------------------------------------------
  # Curio team's OWN deliverable repos (Karma app APP-P3NAPR7O-TSQ67Q).
  # These sit under github.com/Reiers/* — distinct from filecoin-project/curio
  # (canonical repo) already monitored in registry/filoz.yaml. Mirrors the
  # ChainSafe forest-release-cadence / forest-ci-main-health source specs.
  # PROBED 2026-07-16: all three endpoints resolve.
  # ---------------------------------------------------------------------------

  # PROBED 2026-07-16: curl https://api.github.com/repos/Reiers/curio-core/releases
  #   -> 200; team ships Curio Core release tags (v0.2-alpha / v0.3-beta / v1.0).
  # THRESHOLD: PLACEHOLDER — confirm with team
  #   45 days matches the forest-release-cadence convention and Curio's own
  #   curio-sealing-release-cadence entry; an active-maintenance signal.
  - function_id: curio-core-release-cadence
    kernel_function: "Sealing pipeline (PC1/PC2/Commit, SupraSeal, Snap)"
    origin: karma
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Block Production (mining)'
    oso_project_slug: curio-filecoin-project
    sla:
      statement: "The team ships Curio Core release tags at least every 45 days on average (active-maintenance signal on their own deliverable repo), measured monthly"
      metric: avg_days_between_releases
      threshold: { op: "<=", value: 45 }
      cadence: monthly
    source:
      adapter: oso
      kind: http-json
      base_url: "https://api.github.com"
      endpoint: "https://api.github.com/repos/Reiers/curio-core/releases"
      query: "/repos/Reiers/curio-core/releases?per_page=30"
    transform:
      # avg days between consecutive releases; a rich cadence metric the extract vocab cannot express
      sql: "SELECT date_diff('second', MIN(published_at), MAX(published_at)) / NULLIF(COUNT(*) - 1, 0) / 86400.0 FROM raw"

  # PROBED 2026-07-16: curl https://api.github.com/repos/Reiers/lantern/releases
  #   -> 200; the team's second deliverable repo (Lantern).
  # THRESHOLD: PLACEHOLDER — confirm with team
  #   45 days, same rationale as curio-core-release-cadence.
  - function_id: lantern-release-cadence
    kernel_function: "Sealing pipeline (PC1/PC2/Commit, SupraSeal, Snap)"
    origin: karma
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Block Production (mining)'
    oso_project_slug: curio-filecoin-project
    sla:
      statement: "The team ships Lantern release tags at least every 45 days on average (active-maintenance signal on their own deliverable repo), measured monthly"
      metric: avg_days_between_releases
      threshold: { op: "<=", value: 45 }
      cadence: monthly
    source:
      adapter: oso
      kind: http-json
      base_url: "https://api.github.com"
      endpoint: "https://api.github.com/repos/Reiers/lantern/releases"
      query: "/repos/Reiers/lantern/releases?per_page=30"
    transform:
      # avg days between consecutive releases; a rich cadence metric the extract vocab cannot express
      sql: "SELECT date_diff('second', MIN(published_at), MAX(published_at)) / NULLIF(COUNT(*) - 1, 0) / 86400.0 FROM raw"

  # PROBED 2026-07-16: curl 'https://api.github.com/repos/Reiers/curio-core/actions/runs?branch=main&status=success&per_page=10'
  #   -> 200; runs nested under workflow_runs -> extract.path selects them as rows (dlt data_selector).
  # THRESHOLD: PLACEHOLDER — confirm with team
  #   7 days of no successful main CI run signals stalled synapse-sdk compat
  #   maintenance; mirrors forest-ci-main-health's <= 7d SLA.
  - function_id: curio-core-ci-health
    kernel_function: "Sealing pipeline (PC1/PC2/Commit, SupraSeal, Snap)"
    origin: karma
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Block Production (mining)'
    oso_project_slug: curio-filecoin-project
    sla:
      statement: "synapse-sdk compatibility CI passes on Curio Core HEAD: most recent successful CI run on main is <= 7 days old, measured weekly"
      metric: latest_ci_success_age_days
      threshold: { op: "<=", value: 7 }
      cadence: weekly
    source:
      adapter: oso
      kind: http-json
      base_url: "https://api.github.com"
      endpoint: "https://api.github.com/repos/Reiers/curio-core/actions/runs?branch=main&status=success&per_page=10"
      query: "/repos/Reiers/curio-core/actions/runs?branch=main&status=success&per_page=10"
      extract: { path: workflow_runs, column: run_started_at, timestamp_column: run_started_at, cast: date, reduce: latest, derive: age_days, unit: days }
