# DRAFT — kernel coverage with NO grant behind it.
#
# Demoted from registry/venus.yaml on 2026-08-15. This manifest tracks the ESSENTIAL Venus SP-side stack (sophon-miner, Damocles).
# It is OSO-authored: `maintainers: ["@TODO-github-handle"]`, thresholds ours, and the team
# appears nowhere on the ProPGF Batch 3 Funded list. There is no counterparty and no signed
# Appendix 1 §3, so an SLA "breach" here breaches nothing — the readings are ecosystem
# telemetry filed in a schema whose noun is "commitment".
#
# Kept as a draft so the kernel-coverage map still shows the function is watched. Promote if
# and when a grantee signs a §3 for it. See docs/reconciliation-2026-08-15.md.
# Covers the ESSENTIAL Venus SP-side stack — pooled block production (sophon-miner) plus the
# distributed sealing cluster (Damocles). Steward is IPAS / the Venus team
# (ipfs-force-community). The parent Venus node repo is actively maintained and release
# cadence across venus + sophon-miner is lumpy, so commit recency on the two named
# artifacts is the honest maintenance signal here.
team: venus
maintainers: ["@TODO-github-handle"]   # team fills in
x_draft:
  slate: "no-grant-kernel-coverage"
  provenance: "demoted from registry/venus.yaml 2026-08-15 — no counterparty, no signed §3"
  unmeasured: []
functions:
  # Maintenance signal for the pooled block-production component (sophon-miner, aka
  # Venus-Miner) — the block-winning path for Venus SPs. Release cadence is lumpy, so
  # commit recency is the steadier signal.
  # NOTE: dlt flattens the nested GitHub payload; commit.committer.date lands as column
  #   commit__committer__date.
  # THRESHOLD (placeholder, confirm with team): <= 120 days flags an unstaffed release
  # train without flapping between network upgrades.
  - function_id: sophon-miner-maintenance
    kernel_function: "Pooled block production (sophon-miner) + distributed sealing cluster (Damocles)"
    origin: oso
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Block Production (mining)'
    oso_project_slug: ipfs-force-community-venus-hub
    sla:
      statement: "sophon-miner has a commit <= 120 days old, measured monthly — the Venus pooled block-production path must keep pace with network upgrades or Venus SPs lose their independent block-winning route"
      metric: sophon_miner_days_since_last_commit
      threshold: { op: "<=", value: 120 }
      cadence: monthly
    source:
      adapter: oso
      kind: http-json
      base_url: "https://api.github.com"
      auth: { secret_ref: GH_API_TOKEN }
      endpoint: "https://api.github.com/repos/ipfs-force-community/sophon-miner/commits?per_page=30"
      query: "/repos/ipfs-force-community/sophon-miner/commits?per_page=30"
      extract: { column: commit__committer__date, timestamp_column: commit__committer__date, cast: date, reduce: latest, derive: age_days, unit: days }

  # Maintenance signal for the distributed sealing cluster (Damocles, ex venus-cluster) —
  # how Venus SPs onboard committed capacity and data.
  # THRESHOLD (placeholder, confirm with team): same 120-day stall detector as sophon-miner.
  - function_id: damocles-maintenance
    kernel_function: "Pooled block production (sophon-miner) + distributed sealing cluster (Damocles)"
    origin: oso
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Block Production (mining)'
    oso_project_slug: ipfs-force-community-venus-hub
    sla:
      statement: "Damocles has a commit <= 120 days old, measured monthly — the Venus distributed sealing cluster must remain maintained for SP-side client diversity"
      metric: damocles_days_since_last_commit
      threshold: { op: "<=", value: 120 }
      cadence: monthly
    source:
      adapter: oso
      kind: http-json
      base_url: "https://api.github.com"
      auth: { secret_ref: GH_API_TOKEN }
      endpoint: "https://api.github.com/repos/ipfs-force-community/damocles/commits?per_page=30"
      query: "/repos/ipfs-force-community/damocles/commits?per_page=30"
      extract: { column: commit__committer__date, timestamp_column: commit__committer__date, cast: date, reduce: latest, derive: age_days, unit: days }
