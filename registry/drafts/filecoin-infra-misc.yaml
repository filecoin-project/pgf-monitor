# DRAFT — kernel coverage with NO grant behind it.
#
# Demoted from registry/filecoin-infra-misc.yaml on 2026-08-15. This manifest tracks three ESSENTIAL kernel functions covered by pre-existing arrangements (go-paramfetch hosting, SEAD stewardship, monitoring/incident response).
# It is OSO-authored: `maintainers: ["@TODO-github-handle"]`, thresholds ours, and the team
# appears nowhere on the ProPGF Batch 3 Funded list. There is no counterparty and no signed
# Appendix 1 §3, so an SLA "breach" here breaches nothing — the readings are ecosystem
# telemetry filed in a schema whose noun is "commitment".
#
# Kept as a draft so the kernel-coverage map still shows the function is watched. Promote if
# and when a grantee signs a §3 for it. See docs/reconciliation-2026-08-15.md.
# Grab-bag of three ESSENTIAL kernel functions, each covered by pre-existing arrangements
# and each hard to machine-check: trusted-setup parameter hosting (go-paramfetch /
# proofs.filecoin.io), shared infra stewardship (SEAD), and monitoring & incident response.
# This manifest tracks what is currently probeable for each: a fixture placeholder for the
# parameter gateway, a manual committee attestation for stewardship, and the public status
# page (status.filecoin.io) for monitoring.
team: filecoin-infra-misc
maintainers: ["@TODO-github-handle"]   # per-function stewards differ; committee assigns
x_draft:
  slate: "no-grant-kernel-coverage"
  provenance: "demoted from registry/filecoin-infra-misc.yaml 2026-08-15 — no counterparty, no signed §3"
  unmeasured: []
functions:
  # Serving Groth16 trusted-setup parameters to every node and SP (go-paramfetch).
  # proofs.filecoin.io is reachable but serves HTML/raw IPFS blocks, not JSON. Fixture
  # placeholder with value null (indeterminate) until a probeable source exists; do NOT
  # promote this entry as-is.
  # THRESHOLD (placeholder, confirm with team): availability ratio semantics chosen so a
  # future real source (e.g. an uptime checker on a known param CID URL) can drop in
  # without renaming the metric.
  - function_id: trusted-setup-param-hosting
    kernel_function: "Serving Groth16 trusted-setup parameters to every node and SP (go-paramfetch)"
    origin: oso
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Mainnet Infrastructure'
    sla:
      statement: "Groth16 parameter gateway (proofs.filecoin.io) availability >= 0.99, measured monthly — nodes and SPs cannot verify or generate proofs without these files (AWAITING REAL SOURCE; fixture placeholder)"
      metric: param_gateway_availability_ratio
      threshold: { op: ">=", value: 0.99 }
      cadence: monthly
    source:
      adapter: fixture
      endpoint: "https://proofs.filecoin.io/"
      query: "manual: verify the gateway serves the params listed in go-paramfetch parameters.json"
      fixture: trusted_setup_params_placeholder.json

  # Vendor/access governance, runbooks, Slack/Workspace/GitHub stewardship (SEAD).
  # Genuinely unmeasurable coordination work. Fixture placeholder with value null
  # (indeterminate); the honest cadence is a manual committee attestation.
  # THRESHOLD (placeholder, confirm with team): == 1 means "committee attests stewardship
  # was performed this period"; there is nothing to probe.
  - function_id: shared-infra-stewardship
    origin: oso
    tier: essential
    category: 'Coordination & Hardening'
    sub_category: 'Shared infra stewardship'
    oso_project_slug: sead-ai
    sla:
      statement: "Committee attests vendor/access governance, runbooks and workspace stewardship were performed, measured monthly (UNMEASURABLE BY MACHINE; fixture placeholder)"
      metric: stewardship_attestation
      threshold: { op: "==", value: 1 }
      cadence: monthly
    source:
      adapter: fixture
      endpoint: "manual://committee-attestation/shared-infra-stewardship"
      query: "quarterly attestation recorded by the ProPGF committee"
      fixture: sead_stewardship_placeholder.json

  # Monitoring, archival access and incident response — the public slice: the Filecoin
  # status page (Atlassian Statuspage) with automated component checks (Chain Height,
  # Faucet, DRAND relays...). A stale page evidences the monitoring function being
  # abandoned; internal Grafana/OpsGenie remain unmeasured.
  # Single JSON object -> one row; nested page/status objects flatten to columns
  # page__updated_at, status__indicator.
  # THRESHOLD (placeholder, confirm with team): automated checks update this frequently;
  # <= 45 days catches an abandoned page while tolerating a long incident-free stretch.
  - function_id: network-monitoring-status-page
    origin: oso
    tier: essential
    category: 'Coordination & Hardening'
    sub_category: 'Network data & monitoring'
    oso_project_slug: starboard-ventures   # TODO: confirm operator — funding model lists Starboard as monitoring steward; page itself is Statuspage-hosted
    sla:
      statement: "The public Filecoin status page was updated <= 45 days ago, measured weekly — a live status/monitoring surface is the public face of incident response"
      metric: status_page_updated_age_days
      threshold: { op: "<=", value: 45 }
      cadence: weekly
    source:
      adapter: oso
      kind: http-json
      base_url: "https://status.filecoin.io"
      endpoint: "https://status.filecoin.io/api/v2/status.json"
      query: "/api/v2/status.json"
      extract: { column: page__updated_at, cast: date, reduce: single, derive: age_days, unit: days }
