# ChainSafe builds and operates Forest, an independent Rust Filecoin full node, plus
# mainnet/calibnet bootstrap and snapshot infrastructure.
#
# This manifest instruments TWO SEPARATE ChainSafe grants; each functions[] entry names its payer
# via grant_ref. Only forest-release-cadence and calibnet-miner-power carry a bar backed by a
# signed document; the rest are measured and not scored (see each unscored_reason).
# Detail in contracts/chainsafe.facts.yaml (maintainer-local).
team: chainsafe
maintainers: ["@lemmih", "@dignifiedquire"]
functions:

  # Snapshot-listing worker (ChainSafe/filecoin-snapshot-listing) publishes a JSON listing
  # via ?format=json — used here instead of the unversioned /list/mainnet/latest endpoint,
  # which returns an empty listing.
  # THRESHOLD: 6h — roughly three missed cycles at the observed ~2h publish cadence.
  - function_id: mainnet-snapshot-freshness
    kernel_id: validated-snapshots
    origin: oso
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Mainnet Infrastructure'
    funded_project_oso_slug: forest-chainsafe
    grant_ref: APP-P0UD8I92-78VVRM
    sla:
      statement: "Mainnet snapshot freshness: age of the newest snapshot in the archive listing, measured daily"
      metric: snapshot_age_seconds
      cadence: daily
      unscored_reason: not-in-appendix
    source:
      adapter: oso
      kind: http-json
      base_url: "https://forest-archive.chainsafe.dev"
      endpoint: "https://forest-archive.chainsafe.dev/list/mainnet/latest-v2?format=json&limit=20"
      query: "/list/mainnet/latest-v2?format=json&limit=20"
      extract: { path: items, column: uploaded, timestamp_column: uploaded, cast: date, reduce: latest, derive: age_seconds, unit: seconds }

  # ChainSafe operates bootstrap-{mainnet,calibnet}-{0,1,2}.chainsafe-fil.io. This checks
  # only that the bootstrap hostname resolves (DNS-over-HTTPS, JSON); libp2p reachability
  # on TCP 34000 is not HTTP-probeable and remains unmeasured.
  # dlt normalizes the Status field to column `status`; Question/Answer arrays land in
  # child tables — do not set max_table_nesting: 0.
  # THRESHOLD: == 0 is the DNS RCODE for NOERROR — self-evident, not a placeholder.
  - function_id: bootstrap-dns-mainnet
    kernel_id: bootstrap-seed-nodes
    origin: oso
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Mainnet Infrastructure'
    funded_project_oso_slug: filecoin-community-services-chainsafe
    grant_ref: APP-VQC3PIBY-G2UDZJ
    sla:
      statement: "ChainSafe mainnet bootstrap host resolvability: DNS RCODE for bootstrap-mainnet-0.chainsafe-fil.io, measured daily — a fresh node that cannot resolve its seed peers 'starts and just sits there'"
      metric: bootstrap_dns_status
      cadence: daily
      unscored_reason: not-in-appendix
    source:
      adapter: oso
      kind: http-json
      base_url: "https://dns.google"
      endpoint: "https://dns.google/resolve?name=bootstrap-mainnet-0.chainsafe-fil.io&type=A"
      query: "/resolve?name=bootstrap-mainnet-0.chainsafe-fil.io&type=A"
      # explicit root selector: without it dlt auto-descends into the longest nested
      # list (Question/Answer) and the Status field never lands
      data_selector: "$"
      extract: { column: status, reduce: single, derive: value, unit: rcode }

  # Calibnet snapshot hosting keeps the upgrade-rehearsal testnet cheap to (re)join — a
  # distinct metric from calibnet chain liveness.
  # THRESHOLD: 6h — same rationale as mainnet-snapshot-freshness.
  - function_id: calibnet-snapshot-freshness
    kernel_id: calibnet-upgrade-rehearsal
    origin: oso
    tier: essential
    category: 'Coordination & Hardening'
    sub_category: 'Testnets'
    funded_project_oso_slug: filecoin-community-services-chainsafe
    grant_ref: APP-VQC3PIBY-G2UDZJ
    sla:
      statement: "Calibnet snapshot freshness: age of the newest snapshot in the archive listing, measured daily"
      metric: calibnet_snapshot_age_seconds
      cadence: daily
      unscored_reason: not-in-appendix
    source:
      adapter: oso
      kind: http-json
      base_url: "https://forest-archive.chainsafe.dev"
      endpoint: "https://forest-archive.chainsafe.dev/list/calibnet/latest-v2?format=json&limit=20"
      query: "/list/calibnet/latest-v2?format=json&limit=20"
      extract: { path: items, column: uploaded, timestamp_column: uploaded, cast: date, reduce: latest, derive: age_seconds, unit: seconds }

  # From the team's own Karma application: Infra Services proposed "Calibnet miner power —
  # Filfox: miner t0181521 — on-chain QAP — target 250 TB QAP on-chain."
  # Nested `miner` object flattens to miner__quality_adj_power; tokens/ownedMiners are
  # nested arrays, hence data_selector "$" to pin the root object.
  # THRESHOLD: 250e12 — the team's own Karma target, not a placeholder.
  - function_id: calibnet-miner-power
    kernel_id: calibnet-miners
    origin: karma
    tier: essential
    category: 'Coordination & Hardening'
    sub_category: 'Testnets - miners'
    funded_project_oso_slug: filecoin-community-services-chainsafe
    grant_ref: APP-VQC3PIBY-G2UDZJ
    sla:
      statement: "ChainSafe's calibnet rehearsal miner t0181521 keeps >= 250 TB quality-adjusted power on-chain (the team's own Karma target), measured weekly"
      metric: calibnet_miner_qap_bytes
      unscored_reason: contract-not-executed
      cadence: weekly
    source:
      adapter: oso
      kind: http-json
      base_url: "https://calibration.filfox.info"
      endpoint: "https://calibration.filfox.info/api/v1/address/t0181521"
      query: "/api/v1/address/t0181521"
      data_selector: "$"
      extract: { column: miner__quality_adj_power, cast: float, reduce: single, derive: value, unit: bytes }

  # Forest's own release cadence (active-maintenance signal for the node client).
  - function_id: forest-release-cadence
    kernel_id: forest-full-node
    origin: oso
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Ledger & Consensus'
    funded_project_oso_slug: forest-chainsafe
    grant_ref: APP-P0UD8I92-78VVRM
    repos:
      - chainsafe/forest
    sla:
      statement: "Forest ships a release at least every 45 days on average (active-maintenance signal), measured monthly"
      metric: avg_days_between_releases
      unscored_reason: contract-not-executed
      cadence: monthly
    source:
      adapter: oso
      kind: http-json
      base_url: "https://api.github.com"
      auth: { secret_ref: GH_API_TOKEN }
      endpoint: "https://api.github.com/repos/ChainSafe/forest/releases"
      query: "/repos/ChainSafe/forest/releases?per_page=30"
    transform:
      # avg days between consecutive releases; a rich cadence metric the extract vocab cannot express
      sql: "SELECT date_diff('second', MIN(published_at), MAX(published_at)) / NULLIF(COUNT(*) - 1, 0) / 86400.0 FROM raw"
