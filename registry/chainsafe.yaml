#         Latest-successful-run age (verified, below) is the expressible proxy.
  # ---- Slate row 1: Forest (APP-P0UD8I92-78VVRM) — Forest bid --------------------------
  # (forest-ci-main-health removed 2026-07-22 — dropped by the ProPGF committee review;
  #  Forest maintenance is covered by forest-release-cadence below.)
  # Kernel: "Validated snapshot generation & hosting (~2h cadence)".
  # REAL replacement for the forest-snapshots fixture in registry/chainsafe.yaml (same
  # <=6h SLA intent). The snapshot-listing worker (ChainSafe/filecoin-snapshot-listing)
  # exposes a JSON listing via ?format=json.
  # PROBED 2026-07-15: curl 'https://forest-archive.chainsafe.dev/list/mainnet/latest-v2?format=json&limit=20'
  #   -> 200 application/json, total=122, items[0].uploaded=2026-07-15T01:13:42Z (~1.3h old);
  #   previous item 2026-07-14T23:10:30Z -> observed cadence ~2.05h. items[] is nested ->
  #   extract.path selects it. NOTE: /list/mainnet/latest (unversioned) returned total=0;
  #   the populated bucket is latest-v2.
  # THRESHOLD: 21600s (6h) — observed ~2h publish cadence, so 6h = roughly three missed
  #   cycles; matches the existing fixture SLA in registry proper.
  - function_id: mainnet-snapshot-freshness
    kernel_function: "Validated snapshot generation & hosting (~2h cadence)"
    origin: oso
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Mainnet Infrastructure'
    oso_project_slug: forest-chainsafe
    sla:
      statement: "Fresh validated mainnet snapshots keep publishing: newest snapshot in the archive listing is <= 21600s (6h) old, measured daily"
      metric: snapshot_age_seconds
      threshold: { op: "<=", value: 21600 }
      cadence: daily
    source:
      adapter: oso
      kind: http-json
      base_url: "https://forest-archive.chainsafe.dev"
      endpoint: "https://forest-archive.chainsafe.dev/list/mainnet/latest-v2?format=json&limit=20"
      query: "/list/mainnet/latest-v2?format=json&limit=20"
      extract: { path: items, column: uploaded, timestamp_column: uploaded, cast: date, reduce: latest, derive: age_seconds, unit: seconds }

  # ---- Slate row 2: Infra Services (APP-VQC3PIBY-G2UDZJ) ------------------------------
  # Kernel: "Operation of seed nodes a new peer contacts on startup".
  # ChainSafe operates bootstrap-{mainnet,calibnet}-{0,1,2}.chainsafe-fil.io (canonical
  # list: ChainSafe/forest build/bootstrap/*). HONEST LIMIT: this checks only that the
  # bootstrap hostname RESOLVES (DNS-over-HTTPS, JSON); libp2p reachability on TCP 34000
  # is not HTTP-probeable — see x_draft.unmeasured.
  # PROBED 2026-07-15: curl 'https://dns.google/resolve?name=bootstrap-mainnet-0.chainsafe-fil.io&type=A'
  #   -> 200, Status=0 (NOERROR), 1 A record (148.113.16.168). calibnet-0 likewise Status=0.
  #   dlt normalizes the Status field to column `status`; Question/Answer arrays land in
  #   child tables (do NOT set max_table_nesting: 0).
  # THRESHOLD: == 0 is the DNS RCODE for NOERROR — self-evident, not a placeholder.
  - function_id: bootstrap-dns-mainnet
    kernel_function: "Operation of seed nodes a new peer contacts on startup"
    origin: oso
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Mainnet Infrastructure'
    oso_project_slug: filecoin-community-services-chainsafe
    sla:
      statement: "ChainSafe mainnet bootstrap host stays resolvable: DNS RCODE for bootstrap-mainnet-0.chainsafe-fil.io == 0 (NOERROR), measured daily — a fresh node that cannot resolve its seed peers 'starts and just sits there'"
      metric: bootstrap_dns_status
      threshold: { op: "==", value: 0 }
      cadence: daily
    source:
      adapter: oso
      kind: http-json
      base_url: "https://dns.google"
      endpoint: "https://dns.google/resolve?name=bootstrap-mainnet-0.chainsafe-fil.io&type=A"
      query: "/resolve?name=bootstrap-mainnet-0.chainsafe-fil.io&type=A"
      # explicit root selector: without it dlt auto-descends into the longest nested
      # list (Question/Answer) and the Status field never lands (found live 2026-07-15)
      data_selector: "$"
      extract: { column: status, reduce: single, derive: value, unit: rcode }

  # Calibnet infra support: the Infra Services bid explicitly covers the calibnet
  # snapshot service. Chain liveness for calibnet is already in kernel_demo.yaml
  # (calibnet-chain-liveness via calibration.filfox.info) — this measures the DIFFERENT
  # thing ChainSafe operates: calibnet snapshot hosting, which keeps the upgrade-rehearsal
  # testnet cheap to (re)join.
  # PROBED 2026-07-15: curl 'https://forest-archive.chainsafe.dev/list/calibnet/latest-v2?format=json&limit=20'
  #   -> 200, total=166, items[0].uploaded=2026-07-15T00:32:55Z (~2h old); previous item
  #   2026-07-14T22:41:31Z -> same ~2h cadence as mainnet.
  # THRESHOLD: 21600s (6h) — same rationale as mainnet-snapshot-freshness.
  - function_id: calibnet-snapshot-freshness
    origin: oso
    tier: essential
    category: 'Coordination & Hardening'
    sub_category: 'Testnets'
    oso_project_slug: filecoin-community-services-chainsafe
    sla:
      statement: "Fresh calibnet snapshots keep publishing: newest snapshot in the archive listing is <= 21600s (6h) old, measured daily"
      metric: calibnet_snapshot_age_seconds
      threshold: { op: "<=", value: 21600 }
      cadence: daily
    source:
      adapter: oso
      kind: http-json
      base_url: "https://forest-archive.chainsafe.dev"
      endpoint: "https://forest-archive.chainsafe.dev/list/calibnet/latest-v2?format=json&limit=20"
      query: "/list/calibnet/latest-v2?format=json&limit=20"
      extract: { path: items, column: uploaded, timestamp_column: uploaded, cast: date, reduce: latest, derive: age_seconds, unit: seconds }

  # ---- From the team's own Karma application (3.2 Verification metrics) --------------
  # Infra Services proposed: "Calibnet miner power — Filfox: miner t0181521 — on-chain
  # QAP — target 250 TB QAP on-chain."
  # PROBED 2026-07-15: calibration.filfox.info/api/v1/address/t0181521 -> 200,
  #   miner.qualityAdjPower = 261477608980480 (~261 TB, above their 250 TB target).
  #   Nested `miner` object flattens to miner__quality_adj_power; tokens/ownedMiners are
  #   nested ARRAYS -> data_selector "$" pins the root object.
  # THRESHOLD: 250e12 — the team's own Karma target, not a placeholder.
  - function_id: calibnet-miner-power
    origin: karma
    tier: essential
    category: 'Coordination & Hardening'
    sub_category: 'Testnets - miners'
    oso_project_slug: filecoin-community-services-chainsafe
    sla:
      statement: "ChainSafe's calibnet rehearsal miner t0181521 keeps >= 250 TB quality-adjusted power on-chain (the team's own Karma target), measured weekly"
      metric: calibnet_miner_qap_bytes
      threshold: { op: ">=", value: 250000000000000 }
      cadence: weekly
    source:
      adapter: oso
      kind: http-json
      base_url: "https://calibration.filfox.info"
      endpoint: "https://calibration.filfox.info/api/v1/address/t0181521"
      query: "/api/v1/address/t0181521"
      data_selector: "$"
      extract: { column: miner__quality_adj_power, cast: float, reduce: single, derive: value, unit: bytes }

  # ---- Routed from registry/kernel_demo.yaml (dissolved 2026-07-15); OSO reference metric ----
  - function_id: forest-release-cadence
    kernel_function: "Independent Rust full node (sync, validation, RPC, snapshot export)"
    origin: oso
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Ledger & Consensus'
    oso_project_slug: forest
    sla:
      statement: "Forest ships a release at least every 45 days on average (active-maintenance signal), measured monthly"
      metric: avg_days_between_releases
      threshold: { op: "<=", value: 45 }
      cadence: monthly
    source:
      adapter: oso
      kind: http-json
      base_url: "https://api.github.com"
      endpoint: "https://api.github.com/repos/ChainSafe/forest/releases"
      query: "/repos/ChainSafe/forest/releases?per_page=30"
    transform:
      # avg days between consecutive releases; a rich cadence metric the extract vocab cannot express
      sql: "SELECT date_diff('second', MIN(published_at), MAX(published_at)) / NULLIF(COUNT(*) - 1, 0) / 86400.0 FROM raw"
