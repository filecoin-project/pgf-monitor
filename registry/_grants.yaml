# The grant bridge: one row per ProPGF Batch 3 KERNEL grant.
#
# Every field is spelled out rather than inferred, because each one answers a different question
# and they were previously being conflated:
#
#   application_*          what was applied for, and where that application lives on Karma
#   funded_project_*       who is being paid, as named in the SIGNED AGREEMENT
#   metrics_registry       the manifest whose functions[] instrument this grant
#   facts / agreement_*    the contract terms, and the document they come from
#
# Validated against _grants_schema.json; loaded by src/fpm/grants.py. `application_ref_id` is the
# join key: manifests point back at it via each entry's `grant_ref`.
#
# SCOPE: Kernel track only, 16 grants. The three Non-Kernel/RFP lines on the Funded list
# (Open Model, js-libp2p, Synaps3) and Pyth (on the slate, never funded) are deliberately absent -
# they get no monitored commitments, so a row here would imply an instrumentation gap that is not
# one. `application_funding_category` is Kernel on every row for that reason, and is kept explicit
# so a later batch can add another track without the file's scope becoming implicit.
#
# MONEY IS NOT HERE, deliberately. For several grants the committee slate, the signed Exhibit B
# and the facts file each carry a different figure, and one grant is part-denominated in FIL. Those
# are different claims about different questions; the facts file is where a reconciled figure
# belongs, and a copy here would be one more number to disagree with. contracts/ is also
# maintainer-local, which is the right place for contract terms.
#
# `funded_project_oso_slug` is the payee as named in the SIGNED AGREEMENT, not as resolved by the
# slate's applicant_identity: for Curio the agreement is addressed "Dear Filoz Team", so the slug
# is filozone even though the slate says reiers-filecoin. Note also that
# filpgf_private.propgf_applications.oso_project_slug is UNRELIABLE (it resolves Chain.Love to
# filecoin-project and both Blockscout and Pyth to ankr-network) and must not be used here.
#
# Karma identity is per-APPLICATION, not per-team: every Batch 3 Karma project carries the
# application's title and collisions take a numeric suffix (filponto-1, and a second drand project
# distinct from Batch 2's). So application_karma_project_slug is MUTABLE - it follows the title -
# while application_karma_project_id is the stable key. Cross-batch team identity rides on
# funded_project_oso_slug alone. All 16 ids were verified live against gapapi.karmahq.xyz on
# 2026-08-18; they resolve in the UI at https://app.filpgf.io/project/<id>.
