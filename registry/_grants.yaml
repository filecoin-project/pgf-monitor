# The grant bridge: Karma application id <-> OSO project slug <-> the files that instrument it.
#
# One row per ProPGF grant on the committee slate, plus rows for applications we drafted against
# that were never funded. Validated against _grants_schema.json; loaded by src/fpm/grants.py.
#
# WHY THIS FILE EXISTS. Three sources each held a fragment of this mapping and none was
# authoritative:
#   * the slate in the warehouse (funding_model_static.decisions, csnap-% events at the latest
#     snapshot) has app_ref, amount, and an identity-resolved slug that is often a PERSON -- the
#     Curio grant reads "Reiersen" there;
#   * a _LABEL dict inside dashboards/propgf-kernel-health.py mapped app_ref to the
#     committee-facing project name, and that correction lived nowhere else;
#   * contracts/<team>.facts.yaml carries app_ref + contract terms, one file per team.
# None of them could express a project holding two grants (zondax: Core Infra and Beryx;
# reiers-filecoin: Curio and Plumbline), so "is this grant instrumented?" had no answer.
#
# MONEY IS NOT HERE, deliberately. The Curio grant reads $300,000 on the slate, $320,000 + 67,200
# FIL in its signed Exhibit B, and 213,332 in its facts file (the through-December tranches). A
# fourth copy would be a fourth number to disagree with. The facts file is where a reconciled
# figure belongs.
#
# `funded_project_oso_slug` is the payee as named in the SIGNED AGREEMENT, not as resolved by the
# slate's applicant_identity: for Curio the agreement is addressed "Dear Filoz Team" and signed
# "Blueshift Foundation Filoz", so the slug is filozone even though the slate says reiers-filecoin.
grants:
  - app_ref: APP-P3NAPR7O-TSQ67Q
    label: Curio (FilOz)
    funded_project_oso_slug: filozone
    status: funded
    manifest: registry/filoz.yaml
    facts: contracts/filoz.facts.yaml
    agreement_doc_id: 1wdQmU721v0zcyj0fQ4JxLRl8xI7zftfs
    note: >-
      Slate applicant_identity resolves this to reiers-filecoin (a person); the signed agreement
      is addressed to the FilOz Team. Its Appendix 1 s3 thresholds all read "(to confirm)".

