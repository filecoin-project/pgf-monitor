functions:
  # (zondax-node-rpc-mainnet-head-lag removed 2026-07-22 — dropped by the ProPGF committee
  #  review as redundant; the archival-depth check below covers the same RPC read surface.)
  #
  # Same kernel function, the ARCHIVAL half: the Core Infra bid specifically funds archival
  # nodes (deep chain history is what Rosetta/exchange integrations need; pruned nodes keep
  # only recent state). Requesting a tipset from Sep 2020 (epoch 100000) proves the endpoint
  # still serves genesis-deep history, not just the recent window. Freshness above + depth
  # here bracket the RPC read surface.
  #
  # PROBED 2026-07-15T02:32Z: curl -X POST https://api.zondax.ch/fil/node/mainnet/rpc/v1
  #   '{"jsonrpc":"2.0","method":"Filecoin.ChainGetTipSetByHeight","params":[100000,null],"id":1}'
  #   -> 200, no auth, error null; result.Height = 100000 exactly, 8 blocks in the tipset.
  # Same flattening reasoning as above: height on the parent row; Blocks/Cids ->
  #   child tables (do not set max_table_nesting: 0).
  # THRESHOLD: not a placeholder — equality with the requested height is the definition of
  #   success. Epoch 100000 is a non-null round (probed), so the returned Height is stable;
  #   a pruned or degraded node errors out (failed fetch) or cannot answer at all.
  - function_id: zondax-node-rpc-archival-depth
    kernel_function: "Chain sync & state management (snapshot bootstrap, heaviest-chain, RPC)"
    origin: oso
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Ledger & Consensus'
    oso_project_slug: zondax
    sla:
      statement: "Zondax archival RPC serves genesis-deep chain history: ChainGetTipSetByHeight(100000) returns the tipset at exactly height 100000 (Sep 2020), measured weekly — pruned nodes cannot answer this"
      metric: archival_tipset_height_served
      threshold: { op: "==", value: 100000 }
      cadence: weekly
    source:
      adapter: oso
      kind: http-json
      base_url: "https://api.zondax.ch"
      endpoint: "https://api.zondax.ch/fil/node/mainnet/rpc/v1"
      query: "/fil/node/mainnet/rpc/v1"
      method: POST
      params: { jsonrpc: "2.0", method: "Filecoin.ChainGetTipSetByHeight", params: [100000, null], id: 1 }
      # result is the JSON-RPC payload object; without an explicit selector dlt
      # auto-descends into the LONGEST nested list (Cids!) — found live 2026-07-15.
      data_selector: result
    transform:
      # the Height the node actually returned for the archival lookup (parent row scalar)
      sql: "SELECT MAX(height) FROM raw"

  # ---- From the team's own Karma application (3.2 Verification metrics) --------------
  # Zondax proposed: "Rosetta release currency — days from a Lotus release to Rosetta
  # compatibility, target < 7 days, no missed releases."
  # PROBED 2026-07-15: api.github.com/repos/Zondax/rosetta-filecoin-proxy/releases -> 200,
  #   latest v1.3600.2 published 2026-07-07 (~8d old).
  # LIMITATION: the true metric is relative to Lotus releases (a two-table join the
  #   bounded transform cannot express). Proxy: days since the latest Rosetta release,
  #   <= 60 (Lotus ships ~monthly; a Rosetta release older than 2 Lotus cycles means a
  #   missed window). PLACEHOLDER pending the cross-repo comparison.
  - function_id: rosetta-release-currency
    kernel_function: "Chain sync & state management (snapshot bootstrap, heaviest-chain, RPC)"
    origin: karma
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Ledger & Consensus'
    oso_project_slug: zondax
    sla:
      statement: "Rosetta stack stays current with node releases: latest rosetta-filecoin-proxy release <= 60 days old (proxy for the team's <7d-after-Lotus Karma commitment), measured weekly"
      metric: rosetta_release_age_days
      threshold: { op: "<=", value: 60 }
      cadence: weekly
    source:
      adapter: oso
      kind: http-json
      base_url: "https://api.github.com"
      endpoint: "https://api.github.com/repos/Zondax/rosetta-filecoin-proxy/releases?per_page=10"
      query: "/repos/Zondax/rosetta-filecoin-proxy/releases?per_page=10"
      extract: { column: published_at, timestamp_column: published_at, cast: date, reduce: latest, derive: age_days, unit: days }
