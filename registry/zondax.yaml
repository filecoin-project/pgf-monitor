# Zondax operates public Filecoin RPC with archival depth, and maintains the Rosetta
# integration stack. This manifest tracks archival reachability and Rosetta release currency.
#
# The first two entries belong to the Core Infra grant and are scored against its executed
# appendix. The third is the Beryx grant's (own executed agreement, s3 named the metric but no
# source or bar), read with a Beryx API token because no public source exists. Detail in
# contracts/zondax.facts.yaml and contracts/beryx.facts.yaml (maintainer-local).
team: zondax
maintainers: ["@TODO-github-handle"]   # team fills in
functions:
  # The archival half of chain sync & state management: Zondax's public archival node RPC
  # (deep chain history is what Rosetta/exchange integrations need; pruned nodes keep only
  # recent state). Requesting a tipset from Sep 2020 (epoch 100000) proves the endpoint
  # still serves genesis-deep history, not just the recent window.
  #
  # height lands on the parent row; Blocks/Cids -> child tables (do not set
  # max_table_nesting: 0).
  # THRESHOLD: not a placeholder — equality with the requested height is the definition of
  #   success. A pruned or degraded node errors out (failed fetch) or cannot answer at all.
  - function_id: zondax-node-rpc-archival-depth
    kernel_id: chain-sync-state
    origin: oso
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Ledger & Consensus'
    funded_project_oso_slug: zondax
    grant_ref: APP-WVTOW236-LUGH7Y
    sla:
      statement: "Zondax archival RPC depth: the height returned by ChainGetTipSetByHeight(100000), Sep 2020, measured weekly — pruned nodes cannot answer this"
      metric: archival_tipset_height_served
      cadence: weekly
      threshold: { op: "==", value: 100000, source: signed-appendix }
    source:
      adapter: oso
      kind: http-json
      base_url: "https://api.zondax.ch"
      endpoint: "https://api.zondax.ch/fil/node/mainnet/rpc/v1"
      query: "/fil/node/mainnet/rpc/v1"
      method: POST
      params: { jsonrpc: "2.0", method: "Filecoin.ChainGetTipSetByHeight", params: [100000, null], id: 1 }
      # result is the JSON-RPC payload object; without an explicit selector dlt
      # auto-descends into the LONGEST nested list (Cids!).
      data_selector: result
    transform:
      # the Height the node actually returned for the archival lookup (parent row scalar)
      sql: "SELECT MAX(height) FROM raw"

  # Zondax's own stated commitment: Rosetta release currency — days from a Lotus release to
  # Rosetta compatibility, target < 7 days, no missed releases.
  # LIMITATION: the true metric is relative to Lotus releases (a two-table join the
  #   bounded transform cannot express). Proxy: days since the latest Rosetta release,
  #   <= 60 (Lotus ships ~monthly; a Rosetta release older than 2 Lotus cycles means a
  #   missed window).
  # THRESHOLD (placeholder, confirm with team): pending the cross-repo comparison above.
  - function_id: rosetta-release-currency
    kernel_id: chain-sync-state
    origin: karma
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Ledger & Consensus'
    funded_project_oso_slug: zondax
    grant_ref: APP-WVTOW236-LUGH7Y
    repos:
      - zondax/rosetta-filecoin-proxy
    sla:
      statement: "Rosetta stack currency: age of the latest rosetta-filecoin-proxy release, measured weekly"
      metric: rosetta_release_age_days
      cadence: weekly
      threshold: { op: "<=", value: 60, source: signed-appendix }
    source:
      adapter: oso
      kind: http-json
      base_url: "https://api.github.com"
      auth: { secret_ref: GH_API_TOKEN }
      endpoint: "https://api.github.com/repos/Zondax/rosetta-filecoin-proxy/releases?per_page=10"
      query: "/repos/Zondax/rosetta-filecoin-proxy/releases?per_page=10"
      extract: { column: published_at, timestamp_column: published_at, cast: date, reduce: latest, derive: age_days, unit: days }

  # Beryx traces freshness: how far behind the chain head Beryx's trace-derived data is. Beryx
  # serves traces as transactions with level > 0 (internal calls parsed from execution traces).
  # Cron calls the market actor f05 every epoch, so f05's newest level > 0 row advances every 30s
  # while traces index; a stalled indexer shows as a growing lag here.
  # The listing returns newest first; limit=100 (~60 epochs, 89 KB) is the smallest page the API
  # accepts -- 50 and 10 return 422, and sort_by is rejected over 10k rows.
  # PROBE 2026-10-13 20:46 UTC: 200, newest level>0 row at 6453931, 20:45:30Z (~50s behind head;
  #   83% of rows are level 1).
  # AUTH: the API returns 401 on every path without a token. BERYX_API_TOKEN is a free GitHub-login
  #   token; it is a JWT that expires (first one 2026-12-12), and OSO keeps the token it was
  #   provisioned with, so after each renewal run `fpm observe --reprovision`.
  # THRESHOLD: none. The signed s3 lists this metric as a requested addition with no bar.
  - function_id: beryx-traces-indexing-freshness
    kernel_id: chain-etl-indexing
    origin: karma
    tier: essential
    category: 'Coordination & Incentives'
    sub_category: 'Network data & monitoring'
    funded_project_oso_slug: zondax
    grant_ref: APP-ZGCSXHWL-8PJG01
    sla:
      statement: "Beryx traces freshness: seconds between now and the newest trace-derived (level > 0) call Beryx has indexed for the market actor f05, which cron calls every epoch, measured daily"
      metric: beryx_traces_indexing_freshness
      cadence: daily
      unscored_reason: no-signed-bar
    source:
      adapter: oso
      kind: http-json
      base_url: "https://api.zondax.ch"
      auth: { secret_ref: BERYX_API_TOKEN }
      endpoint: "https://api.zondax.ch/fil/data/v4/mainnet/transactions/address/f05/receiver?limit=100"
      query: "/fil/data/v4/mainnet/transactions/address/f05/receiver?limit=100"
      data_selector: transactions
    transform:
      # tx_timestamp is ISO with Z -> dlt lands it tz-aware, so compare against :now_tz
      sql: "SELECT date_diff('second', MAX(tx_timestamp), :now_tz) FROM raw WHERE level > 0"
