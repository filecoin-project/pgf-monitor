# --- COMMITTEE GAPS (Batch 3, 2026-07-22) — kept in the committee sheet, not yet monitored ---
#  datasets_with_tests_docs   : needs a dataset manifest/health endpoint from the team
#  committed_datasets_present : needs a source listing committed datasets
#  datasets_served_available  : needs a served-datasets availability endpoint
functions:
  # Data freshness is THE metric for this function: the portal's value is a daily-updated,
  # vendor-neutral dataset anyone can reuse. The published artifacts are parquet (not JSON),
  # so the closest pipeline-fetchable signal is the GitHub Actions "Pipeline" workflow that
  # builds and publishes them daily.
  # PROBED 2026-07-15: curl "https://api.github.com/repos/davidgasquez/filecoin-data-portal/actions/workflows/pipeline.yml/runs?status=success&per_page=5"
  #   -> 200; latest successful Pipeline run created_at 2026-07-12T14:28:42Z (~2.6 days old at probe);
  #   332 successful runs total. NOTE: the two most recent Pipeline runs (2026-07-13, 2026-07-14)
  #   concluded "failure" — the daily pipeline is flaky right now, so this metric starts out
  #   genuinely near its threshold. That is the point of monitoring it.
  # THRESHOLD: PLACEHOLDER — pipeline is scheduled daily; 3 days tolerates two consecutive failed
  #   runs before alerting. Observed 2.6d at probe (currently borderline).
  - function_id: network-data-portal-pipeline-freshness
    kernel_function: "Aggregates Filecoin on/off-chain data into open, queryable datasets and dashboards"
    origin: oso
    tier: essential
    category: 'Coordination & Incentives'
    sub_category: 'Network data & monitoring'
    oso_project_slug: filecoin-data-portal-davidgasquez
    sla:
      statement: "Datasets stay fresh: most recent successful daily Pipeline run <= 3 days old, measured daily"
      metric: pipeline_success_age_days
      threshold: { op: "<=", value: 3 }
      cadence: daily
    source:
      adapter: oso
      kind: http-json
      base_url: "https://api.github.com"
      endpoint: "https://api.github.com/repos/davidgasquez/filecoin-data-portal/actions/workflows/pipeline.yml/runs?status=success&per_page=5"
      query: "/repos/davidgasquez/filecoin-data-portal/actions/workflows/pipeline.yml/runs?status=success&per_page=5"
      # response is a single object; runs live under workflow_runs -> select them as rows
      extract: { path: workflow_runs, column: created_at, timestamp_column: created_at, cast: date, reduce: latest, derive: age_days, unit: days }
