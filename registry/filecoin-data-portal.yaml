# The Filecoin Data Portal aggregates on/off-chain Filecoin data into open, queryable
# datasets and dashboards that the rest of the ecosystem (including this repo) reads.
#
# Appendix reconciliation 2026-08-18: no agreement of any kind has been located, so the one metric
# here is measured and not scored, and no facts file exists to render an appendix from.
team: filecoin-data-portal
maintainers: ["@davidgasquez"]   # named steward for network-data-portal; team confirms
functions:
  # Data freshness is THE metric for this function: the portal's value is a daily-updated,
  # vendor-neutral dataset anyone can reuse. The published artifacts are parquet (not JSON), so
  # the closest pipeline-fetchable signal is the GitHub Actions "Pipeline" workflow that builds
  # and publishes them daily.
  # THRESHOLD (placeholder, confirm with team): pipeline is scheduled daily; 3 days tolerates two
  # consecutive failed runs before alerting.
  - function_id: network-data-portal-pipeline-freshness
    kernel_id: open-network-datasets
    origin: oso
    tier: essential
    category: 'Coordination & Incentives'
    sub_category: 'Network data & monitoring'
    funded_project_oso_slug: filecoin-data-portal-davidgasquez
    grant_ref: APP-0QLIOMS2-JSK1EM
    repos:
      - davidgasquez/filecoin-data-portal
    sla:
      statement: "Dataset freshness: age of the most recent successful daily Pipeline run, measured daily"
      metric: pipeline_success_age_days
      cadence: daily
      unscored_reason: no-agreement
    source:
      adapter: oso
      kind: http-json
      base_url: "https://api.github.com"
      auth: { secret_ref: GH_API_TOKEN }
      endpoint: "https://api.github.com/repos/davidgasquez/filecoin-data-portal/actions/workflows/pipeline.yml/runs?status=success&per_page=5"
      query: "/repos/davidgasquez/filecoin-data-portal/actions/workflows/pipeline.yml/runs?status=success&per_page=5"
      # response is a single object; runs live under workflow_runs -> select them as rows
      extract: { path: workflow_runs, column: created_at, timestamp_column: created_at, cast: date, reduce: latest, derive: age_days, unit: days }
