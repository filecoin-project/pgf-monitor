# Chain.Love operates public Filecoin RPC infrastructure: the native Lotus surface, the
# FEVM/Eth surface, a calibnet endpoint, and its own uptime/latency metrics feed.
#
# Appendix reconciliation 2026-08-18: every metric here is named in the team's own signed s3, and
# every threshold there is marked "(to confirm)", so all are measured and not scored. Three were
# adopted from its requested-additions block after probing the sources live.
# Detail in contracts/chain-love.facts.yaml (maintainer-local).
team: chain-love
maintainers: ["@TODO-github-handle"]   # team fills in
functions:
  # Kernel function: "Chain sync & state management (snapshot bootstrap, heaviest-chain, RPC)".
  # Chain.Love's funded scope is public RPC / chain-access hosting; this measures the native
  # Lotus read surface of their endpoint keeping pace with the chain.
  # JSON shape: single object -> one parent row; result is a nested OBJECT so dlt flattens
  #   result.Height to column height. Blocks/Cids are nested ARRAYS -> child tables
  #   the transform cannot reach (so max_table_nesting: 0 must NOT be set) — Height is all
  #   we need and it lives on the parent row.
  # CAVEAT: the endpoint sits behind a load balancer and has occasionally been observed to
  #   return the response body duplicated (two newline-delimited copies of the same JSON-RPC
  #   object). If the fetch ever fails to parse, retry before concluding the endpoint is down.
  # Expected epoch = floor((now - 1598306400) / 30): mainnet genesis 2020-08-24T22:00:00Z,
  #   30s epochs. Same formula/constant used across the registry's RPC-freshness entries.
  # THRESHOLD (placeholder, confirm with team): 5 epochs (150s) tolerates fetch-timing noise
  #   and brief block-delivery delays while still catching a genuinely stalled backing node.
  - function_id: chain-sync-rpc-mainnet-head-lag
    kernel_id: chain-sync-state
    origin: oso
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Ledger & Consensus'
    funded_project_oso_slug: chain-love
    grant_ref: APP-P706QNLF-NLQPG5
    sla:
      statement: "Public mainnet RPC chain-head lag: wall-clock expected epoch minus reported Height, measured daily — a stale head means the endpoint's backing node has stopped syncing"
      metric: rpc_head_lag_epochs
      cadence: daily
      unscored_reason: no-signed-bar
    source:
      adapter: oso
      kind: http-json
      base_url: "https://filecoin.chain.love"
      endpoint: "https://filecoin.chain.love/rpc/v1"
      query: "/rpc/v1"
      method: POST
      params: { jsonrpc: "2.0", method: "Filecoin.ChainHead", params: [], id: 1 }
      # result is the JSON-RPC payload object; without an explicit selector dlt
      # would auto-descend into the longest nested list (Cids) instead.
      data_selector: result
    transform:
      # expected epoch from wall clock minus the head Height the endpoint reports; single
      # parent row, MAX() only for aggregate form. 1598306400 = mainnet genesis unix ts.
      sql: "SELECT GREATEST(0, FLOOR((to_unixtime(:now) - 1598306400) / 30.0) - MAX(height)) FROM raw"

  # Same kernel function, FEVM/Eth read surface: the kernel entry names RPC as the read
  # surface for "FEVM dApps", and dApps hit the eth_* API, which is served by a distinct
  # code path (Lotus ETH RPC / chain indexer) that can break while the native API stays up.
  # Distinct from the entry above: same endpoint, different API surface.
  # JSON shape: single flat object {id, jsonrpc, result} -> one row; result is a top-level
  #   hex STRING column, no nested arrays. The extract vocab cannot cast hex, so the
  #   transform decodes it with from_base(substr(result, 3), 16).
  # THRESHOLD (placeholder, confirm with team): 10 epochs (300s) = the mainnet-head allowance
  #   plus slack for the eth view's structural ~1-epoch trail and indexer catch-up.
  - function_id: chain-sync-rpc-fevm-eth-head-lag
    kernel_id: chain-sync-state
    origin: oso
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Ledger & Consensus'
    funded_project_oso_slug: chain-love
    grant_ref: APP-P706QNLF-NLQPG5
    sla:
      statement: "FEVM/Eth RPC chain-head lag: wall-clock expected epoch minus decoded eth_blockNumber, measured daily — the eth_* API is what FEVM dApps depend on and can stall independently of the native API"
      metric: fevm_eth_head_lag_epochs
      cadence: daily
      unscored_reason: no-signed-bar
    source:
      adapter: oso
      kind: http-json
      base_url: "https://filecoin.chain.love"
      endpoint: "https://filecoin.chain.love/rpc/v1"
      query: "/rpc/v1"
      method: POST
      params: { jsonrpc: "2.0", method: "eth_blockNumber", params: [], id: 1 }
    transform:
      # decode the hex block number ("0x...") and compare to wall-clock expected epoch;
      # from_base(substr(result, 3), 16) strips "0x" and parses base-16
      sql: "SELECT GREATEST(0, FLOOR((to_unixtime(:now) - 1598306400) / 30.0) - from_base(substr(MAX(result), 3), 16)) FROM raw"

  # ---------------------------------------------------------------------------
  # Adopted 2026-08-18 from the requested-additions block of Chain.Love's own signed s3. Each
  # source below is named IN THAT DOCUMENT and was probed live before adoption; the facts file's
  # recorded reason ("no calibnet endpoint was found publicly", "no public snapshot endpoint
  # exists") was simply out of date. No thresholds: measurable first, bars agreed later.
  # ---------------------------------------------------------------------------

  # Calibnet side of the same kernel function. Their s3 lists this as a requested addition with
  # source https://calibration.filecoin.chain.love/rpc/v1 and a proposed threshold of 5 epochs.
  # PROBED 2026-08-18: POST Filecoin.ChainHead -> HTTP 200 with a well-formed result.Height.
  # Expected epoch = floor((now - 1667326380) / 30): calibnet genesis 2022-11-01T18:13:00Z.
  # Same JSON shape and flattening as the mainnet entry: with data_selector `result` the payload
  # object becomes the parent row, so result.Height reads as column `height`; Blocks/Cids are
  # nested ARRAYS in child tables the transform cannot reach, which is why max_table_nesting must
  # NOT be set to 0. The selector is not optional -- the first live run of this entry (2026-08-19,
  # observe run 32241214112) returned `transform_error: 400 Bad Request` because without it dlt
  # auto-descends into the longest nested list (Cids) and the parent row, with it `height`, is
  # never loaded.
  - function_id: chain-sync-rpc-calibnet-head-lag
    kernel_id: chain-sync-state
    origin: oso
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Ledger & Consensus'
    funded_project_oso_slug: chain-love
    grant_ref: APP-P706QNLF-NLQPG5
    sla:
      statement: "Public calibnet RPC chain-head lag: wall-clock expected epoch minus reported Height, measured daily — calibnet is the upgrade-rehearsal target developers stage against"
      metric: rpc_calibnet_head_lag_epochs
      cadence: daily
      unscored_reason: no-signed-bar
    source:
      adapter: oso
      kind: http-json
      base_url: "https://calibration.filecoin.chain.love"
      endpoint: "https://calibration.filecoin.chain.love/rpc/v1"
      query: "/rpc/v1"
      method: POST
      params: { jsonrpc: "2.0", method: "Filecoin.ChainHead", params: [], id: 1 }
      # as on the mainnet entry: select the JSON-RPC payload object, or dlt descends into Cids.
      data_selector: result
    transform:
      sql: "SELECT GREATEST(0, FLOOR((to_unixtime(:now) - 1667326380) / 30.0) - MAX(height)) FROM raw"

  # Their s3 names this `bootstrap_node_uptime`, source
  # https://uptimerobot.filecoin.chain.love/monitors/786191541, proposed threshold 99.9%.
  # PROBED 2026-08-18: flat single object -> {uptime: 99.957, total_downtime_seconds: 1108,
  #   incident_count: 1, mtbf, from, to}. data_selector "$" lands it as one row, so extract reads
  #   `uptime` directly; no nested arrays, nothing unreachable.
  # CAVEAT recorded deliberately: the monitor id is the one their document names, but the payload
  #   does not say WHICH target it watches, so this is filed under the public-RPC read surface
  #   (their funded scope) rather than asserting a bootstrap-seed-nodes kernel function we cannot
  #   evidence. Confirm the monitor's target at the next check-in.
  - function_id: rpc-endpoint-uptime
    kernel_id: chain-sync-state
    origin: karma
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Ledger & Consensus'
    funded_project_oso_slug: chain-love
    grant_ref: APP-P706QNLF-NLQPG5
    sla:
      statement: "Chain.Love's own uptime monitor for the funded endpoint reports availability over the trailing window, measured daily — the operator-reported view of the service the grant funds"
      metric: rpc_endpoint_uptime_pct
      cadence: daily
      unscored_reason: no-signed-bar
    source:
      adapter: oso
      kind: http-json
      base_url: "https://uptimerobot.filecoin.chain.love"
      endpoint: "https://uptimerobot.filecoin.chain.love/monitors/786191541"
      query: "/monitors/786191541"
      data_selector: "$"
      extract: { column: uptime, cast: float, reduce: single, derive: value, unit: percent }

  # Their s3 names this `rpc_latency_availability_support`, source
  # https://uptimerobot.filecoin.chain.love/prometheus, proposed threshold 1s. The committee
  # flagged RPC quality beyond head-lag as the most important gap in this grant; this closes it.
  # PROBED 2026-08-18: flat single object -> {response_time_mean_seconds,
  #   response_time_p50_seconds: 0.00876, response_time_p90_seconds, response_time_p99_seconds,
  #   uptime_percent}. p50 is the headline latency number; p90/p99 are available on the same row
  #   if the committee later wants tail latency too.
  - function_id: rpc-latency-p50
    kernel_id: chain-sync-state
    origin: karma
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Ledger & Consensus'
    funded_project_oso_slug: chain-love
    grant_ref: APP-P706QNLF-NLQPG5
    sla:
      statement: "Median public RPC response latency from Chain.Love's own metrics feed, measured daily — a fresh chain head says the node is syncing, but not that the endpoint is usable"
      metric: rpc_p50_latency_seconds
      cadence: daily
      unscored_reason: no-signed-bar
    source:
      adapter: oso
      kind: http-json
      base_url: "https://uptimerobot.filecoin.chain.love"
      endpoint: "https://uptimerobot.filecoin.chain.love/prometheus"
      query: "/prometheus"
      data_selector: "$"
      extract: { column: response_time_p50_seconds, cast: float, reduce: single, derive: value, unit: seconds }
