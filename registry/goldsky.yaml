# Goldsky operates hosted Filecoin FEVM subgraphs: chain ETL and indexing that downstream
# consumers read instead of running their own indexer.
#
# Appendix reconciliation 2026-08-18: no signed agreement has been located, so both metrics are
# measured and not scored. Detail in contracts/goldsky.facts.yaml (maintainer-local).
team: goldsky
maintainers: ["@TODO-github-handle"]   # team fills in
functions:
  # Canary for Goldsky's Filecoin FEVM chain ETL: a Goldsky-hosted public subgraph stays at
  # chain head. Freshness is computed against wall clock from the subgraph's own _meta block
  # timestamp, so a stale backend cannot self-certify. dlt flattens the GraphQL response
  # {data:{meta:{block:{...}}}} into data__meta__block__* columns (the _meta field is aliased
  # to "meta" in the query precisely to keep that name normalization-safe).
  # THRESHOLD (placeholder, confirm with team): <= 600s (20 epochs) tolerates brief reorg/restart
  # catch-up while failing a genuinely stalled FEVM indexing backend. Public endpoints are
  # rate-limited (50 req / 10s) — a daily probe is far under that.
  - function_id: fevm-chain-indexing-freshness
    kernel_id: open-network-datasets
    origin: oso
    tier: essential
    category: 'Coordination & Incentives'
    sub_category: 'Network data & monitoring'
    funded_project_oso_slug: goldsky
    grant_ref: APP-RRMZE7XC-XAVG4W
    sla:
      statement: "Goldsky-hosted Filecoin FEVM subgraph indexing lag: wall clock minus indexed block timestamp, measured daily — stale chain ETL breaks every downstream consumer at once"
      metric: fevm_subgraph_indexing_lag_seconds
      cadence: daily
      unscored_reason: no-agreement
    source:
      adapter: oso
      kind: http-json
      base_url: "https://api.goldsky.com"
      endpoint: "https://api.goldsky.com/api/public/project_cm8i6ca9k24d601wy45zzbsrq/subgraphs/sf-filecoin-mainnet/latest/gn"
      query: "/api/public/project_cm8i6ca9k24d601wy45zzbsrq/subgraphs/sf-filecoin-mainnet/latest/gn"
      method: POST
      # literal GraphQL braces are doubled ({{ }}) — dlt's rest_api treats single braces in
      # param/json values as placeholder expressions.
      params: { query: "{{ meta: _meta {{ block {{ number timestamp }} }} }}" }
    transform:
      # indexing lag in seconds: wall clock at run time minus the unix timestamp of the
      # newest block the Goldsky backend has indexed (~0-60s when healthy)
      sql: "SELECT to_unixtime(:now_tz) - MAX(CAST(data__meta__block__timestamp AS DOUBLE)) FROM raw"

  # Same canary, correctness axis: the subgraph must report no indexing errors — a backend
  # that keeps advancing while flagging hasIndexingErrors is silently serving bad data. dlt
  # normalizes hasIndexingErrors -> has_indexing_errors.
  # THRESHOLD: self-evident — any indexing error is a failure, so the boolean must be 0.
  - function_id: fevm-chain-indexing-errors
    kernel_id: open-network-datasets
    origin: oso
    tier: essential
    category: 'Coordination & Incentives'
    sub_category: 'Network data & monitoring'
    funded_project_oso_slug: goldsky
    grant_ref: APP-RRMZE7XC-XAVG4W
    sla:
      statement: "Goldsky-hosted Filecoin FEVM subgraph indexing-error flag (hasIndexingErrors), measured daily"
      metric: fevm_subgraph_indexing_errors
      cadence: daily
      unscored_reason: no-agreement
    source:
      adapter: oso
      kind: http-json
      base_url: "https://api.goldsky.com"
      endpoint: "https://api.goldsky.com/api/public/project_cm8i6ca9k24d601wy45zzbsrq/subgraphs/sf-filecoin-mainnet/latest/gn"
      query: "/api/public/project_cm8i6ca9k24d601wy45zzbsrq/subgraphs/sf-filecoin-mainnet/latest/gn"
      method: POST
      params: { query: "{{ meta: _meta {{ hasIndexingErrors }} }}" }
    transform:
      # 0 when the backend reports clean indexing, 1 on any reported indexing error
      sql: "SELECT MAX(CASE WHEN data__meta__has_indexing_errors THEN 1.0 ELSE 0.0 END) FROM raw"
