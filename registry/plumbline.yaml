#       why_unverified: "PROBED 2026-07-15: calibration.filfox.info/api/v1/miner/list/power -> 200, 8 miners with tags (e.g. t0143103 'Curio Storage Inc.'), but the topology recently changed and OSO cannot attribute specific miner IDs to Plumbline from public data. Team should list its miner addresses on adoption so a per-miner metric can be added (the miners array also lands in a child table, so this needs a per-miner endpoint, e.g. /api/v1/address/<miner>/power-stats)."
# --- COMMITTEE GAPS (Batch 3, 2026-07-22) — kept in the committee sheet, not yet monitored ---
#  faucet_uptime / faucet_p99_latency : no public calibnet faucet health/latency endpoint — ask team
functions:
  # (calibnet-head-epoch-lag, calibnet-active-miners and calibnet-block-win-spread removed
  #  2026-07-22 — dropped by the ProPGF committee review, which retained only the
  #  team-committed Karma metric below. Per the sheet: "Mainly this matters for Reiers'
  #  Calib miner." The dissolved OSO reference metric calibnet-chain-liveness was dropped
  #  in the same pass.)

  # ---- From the team's own Karma application (3.2 Verification metrics) --------------
  # Plumbline proposed: "SP test-target availability + decentralization — on-chain power
  # on calibration.filfox.info — t0143103 online & steady, held < 1/3 of calibration QAP."
  # PROBED 2026-07-15: calibration.filfox.info/api/v1/address/t0143103 -> 200,
  #   miner.qualityAdjPower = 385241386582016, networkQualityAdjPower = 1040241079091200
  #   -> share 0.370: currently ABOVE the team's own < 1/3 commitment (calibnet has only
  #   8 active miners after the topology change) — expected to read as a breach until the
  #   miner sheds power or the network grows. Both numerator and denominator ride the
  #   SAME response, so the ratio is a single-table transform.
  # THRESHOLD: 0.3334 — the team's own Karma target, not a placeholder.
  - function_id: calibnet-sp-power-share
    origin: karma
    tier: essential
    category: 'Coordination & Hardening'
    sub_category: 'Testnets - miners'
    oso_project_slug: plumbline
    sla:
      statement: "Plumbline's calibnet SP t0143103 stays decentralization-friendly: its share of calibnet quality-adjusted power < 1/3 (the team's own Karma target), measured weekly"
      metric: calibnet_miner_qap_share
      threshold: { op: "<", value: 0.3334 }
      cadence: weekly
    source:
      adapter: oso
      kind: http-json
      base_url: "https://calibration.filfox.info"
      endpoint: "https://calibration.filfox.info/api/v1/address/t0143103"
      query: "/api/v1/address/t0143103"
      data_selector: "$"
    transform:
      # miner and network QAP arrive as string-encoded big ints on the same row
      sql: "SELECT MAX(CAST(miner__quality_adj_power AS DOUBLE) / CAST(miner__network_quality_adj_power AS DOUBLE)) FROM raw"
