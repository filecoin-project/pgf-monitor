# Plumbline operates calibnet storage-provider infrastructure supporting CalibrationNet, the
# NV-upgrade rehearsal environment. This manifest tracks the team's own committed metric:
# decentralization of its calibnet SP's quality-adjusted power share.
team: plumbline
maintainers: ["@TODO-github-handle"]   # team fills in
functions:
  # Plumbline's own commitment: SP test-target availability + decentralization — on-chain
  # power on calibration.filfox.info — t0143103 online & steady, held < 1/3 of calibration QAP.
  # Both numerator and denominator ride the same response, so the ratio is a single-table
  # transform.
  # THRESHOLD: 0.3334 — the team's own committed target, not a placeholder.
  - function_id: calibnet-sp-power-share
    kernel_id: calibnet-miners
    origin: karma
    tier: essential
    category: 'Coordination & Hardening'
    sub_category: 'Testnets - miners'
    funded_project_oso_slug: reiers-filecoin
    grant_ref: APP-U5CX297Z-XKDQDZ
    sla:
      statement: "Plumbline's calibnet SP t0143103 stays decentralization-friendly: its share of calibnet quality-adjusted power < 1/3 (the team's own Karma target), measured weekly"
      metric: calibnet_miner_qap_share
      threshold: { op: "<", value: 0.3334 }
      cadence: weekly
    source:
      adapter: oso
      kind: http-json
      base_url: "https://calibration.filfox.info"
      endpoint: "https://calibration.filfox.info/api/v1/address/t0143103"
      query: "/api/v1/address/t0143103"
      data_selector: "$"
    transform:
      # miner and network QAP arrive as string-encoded big ints on the same row
      sql: "SELECT MAX(CAST(miner__quality_adj_power AS DOUBLE) / CAST(miner__network_quality_adj_power AS DOUBLE)) FROM raw"
