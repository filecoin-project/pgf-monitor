team: chainsafe
maintainers: ["@lemmih", "@dignifiedquire"]
functions:
  - function_id: network-uptime
    kernel_id: chain-sync-state
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Ledger & Consensus'
    funded_project_oso_slug: forest-chainsafe
    sla:
      statement: "Forest node reachable >= 99.9%, measured monthly"
      metric: uptime_ratio
      threshold: { op: ">=", value: 0.999 }
      cadence: monthly
    source:
      adapter: fixture
      endpoint: "grafana://forest/uptime"
      query: 'avg_over_time(up{job="forest"}[30d])'
      fixture: forest_uptime.json
  - function_id: forest-snapshots
    kernel_id: validated-snapshots
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Mainnet Infrastructure'
    funded_project_oso_slug: forest-chainsafe
    sla:
      statement: "Snapshots <= 6h stale, measured daily"
      metric: snapshot_freshness_hours
      threshold: { op: "<=", value: 6 }
      cadence: daily
    source:
      adapter: fixture
      endpoint: "explorer://forest/snapshots"
      query: "latest_snapshot_age_hours"
      fixture: forest_snapshots.json
