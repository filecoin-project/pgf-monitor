# An `oso-sql` metric: read straight from warehouse tables OSO already holds. Used by
# tests/test_adapter_oso_sql.py. Not a real adopted commitment — the FWSS attribution question
# is open (see docs and the FilOz appendix reconciliation).
team: filoz
maintainers: ["@TODO-github-handle"]
functions:
  - function_id: curio-filecoin-pay-fwss-volume
    kernel_id: dealmaking-pdp-retrieval
    tier: essential
    category: 'Blockchain Core & Physical Storage'
    sub_category: 'Block Production (mining)'
    funded_project_oso_slug: filozone
    sla:
      statement: "Filecoin Pay gross payment volume run-rate across FWSS operators, measured daily"
      metric: filecoin_pay_volume_fwss_usd
      cadence: daily
      unscored_reason: no-signed-bar
    source:
      adapter: oso-sql
      kind: oso-sql
      # Mirrors registry/drafts/filoz.yaml: a function of :now, so the same statement serves the
      # nightly and the backfill, with a staleness floor so a dead ingest goes indeterminate.
      sql: |
        SELECT SUM(m.filecoin_pay_gross_payment_volume_run_rate_usd)
        FROM filecoin.data_portal.daily_filecoin_pay_operators_metrics AS m
        WHERE m.date = (
            SELECT MAX(date)
            FROM filecoin.data_portal.daily_filecoin_pay_operators_metrics
            WHERE date <= CAST(:now AS DATE)
              AND date > CAST(:now AS DATE) - INTERVAL '4' DAY
          )
          AND m.operator IN (
            SELECT DISTINCT operator
            FROM filecoin.data_portal.filecoin_pay_rails
            WHERE service IN ('FWSS', 'FCSS')
          )
