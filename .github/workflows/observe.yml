name: observe

# The nightly reading of every adopted metric. Without this, a metric only has a value on days a
# human happened to run `fpm review` — which is why 34 of 47 metrics currently hold exactly one
# observation. Point-in-time sources (RPC head lag, IPNI counts, explorer head age) carry no
# history of their own, so a day missed here is a day lost permanently.
#
# Readings only: no synthesizer, no adjudication. Verdicts stay a human act via `fpm review`.

on:
  schedule:
    - cron: "17 6 * * *"            # 06:17 UTC daily, off the hour to dodge the cron stampede
  workflow_dispatch:
    inputs:
      as_of:
        description: "Observation date (YYYY-MM-DD, default today UTC)"
        required: false
        default: ""
      dry_run:
        description: "Measure and report without writing the CSV"
        type: boolean
        default: false

permissions:
  contents: write                   # the job commits data/observations.csv and data/thresholds.csv back to main

concurrency:
  group: observe
  cancel-in-progress: false         # never interrupt a run mid-write; the CSV is the record

jobs:
  observe:
    runs-on: ubuntu-latest
    # Measured 2026-08-14: two full 47-metric runs at 23m23s and 24m18s, each metric being an
    # OSO ingestion run polled to terminal. 60 leaves ~2.5x headroom and fails a wedged run an
    # hour sooner than the original 90-minute guess did.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      - name: Check credentials
        env:
          OSO_API_KEY: ${{ secrets.OSO_API_KEY }}
          OSO_ORG_ID: ${{ vars.OSO_ORG_ID }}
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
        run: |
          set -euo pipefail
          # Fail loudly rather than silently recording a night of indeterminate readings.
          [ -n "$OSO_API_KEY" ] || { echo "::error::OSO_API_KEY secret is not set"; exit 1; }
          # GH_API_TOKEN is OPTIONAL here, by design. OSO keeps a source credential once its
          # dataset is provisioned, so triggering runs needs no token — only CREATING or
          # re-attaching a dataset does, and that is done by a human from a host that holds it.
          # If the secret is absent and a dataset needs (re)provisioning, the run fails loudly
          # naming the metric, rather than quietly fetching anonymously.
          [ -n "$GH_API_TOKEN" ] || echo "::notice::GH_API_TOKEN not set — fine for existing datasets; provisioning a NEW authenticated source will fail with a named error"
          # OSO_ORG_ID is a repository VARIABLE, not a secret — it is not sensitive, and reading
          # it from `secrets` silently yields an empty string.
          [ -n "$OSO_ORG_ID" ] || { echo "::error::OSO_ORG_ID variable is not set"; exit 1; }

      - name: Observe every adopted metric
        env:
          OSO_API_KEY: ${{ secrets.OSO_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
        run: |
          set -euo pipefail
          uv run fpm observe \
            --live-oso --oso-org "${{ vars.OSO_ORG_ID }}" \
            ${{ inputs.as_of && format('--as-of {0}', inputs.as_of) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit the day's readings
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/observations.csv data/thresholds.csv; then
            echo "no change to data/observations.csv or data/thresholds.csv"
            exit 0
          fi
          git add data/observations.csv data/thresholds.csv
          git commit -m "chore(observations): readings and thresholds for $(date -u +%F)"
          # A concurrent merge to main between checkout and push is normal, not an error.
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

      # Committing the CSV is only half the record. OSO's filpgf_sla_observations and
      # filpgf_sla_thresholds are full-table republishes of these two files, and nothing else
      # refreshes them -- so before this step the warehouse (and the dashboard reading it) drifted
      # behind the repo silently: on 2026-08-19 the CSVs held readings through the 19th while both
      # published tables still ended on the 17th, because the last republish was whenever someone
      # last ran scripts/run_full_review.sh by hand.
      #
      # Order is load-bearing (docs/guide-reviewers.md s4): thresholds FIRST, observations LAST.
      # Republishing observations narrows that table to the columns the dashboard's committed query
      # expects, so inverting the order leaves a window where the dashboard's obs_data cell takes
      # its bare-except fallback and every chart silently empties.
      #
      # A full-table republish of unchanged CSVs is a no-op, so this is safe on a quiet night.
      - name: Republish the series to OSO
        if: ${{ !inputs.dry_run }}
        env:
          OSO_API_KEY: ${{ secrets.OSO_API_KEY }}
        run: |
          set -euo pipefail
          uv run python scripts/observations.py upload-thresholds --oso-org "${{ vars.OSO_ORG_ID }}"
          uv run python scripts/observations.py upload --oso-org "${{ vars.OSO_ORG_ID }}"
