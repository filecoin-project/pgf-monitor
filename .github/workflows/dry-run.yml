name: dry-run
on:
  pull_request_target:
    types: [labeled]
permissions:
  contents: read
concurrency:
  # Two dry-runs for the same PR would share a throwaway dataset name and delete it
  # out from under each other. One at a time, per PR.
  group: dry-run-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  live-dry-run:
    if: github.event.label.name == 'dry-run-ok'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4                 # BASE repo code (trusted); never PR code
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Extract changed manifests (head + base) as data, not code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # NOT --depth=1. A shallow head has no common ancestor with the base, so the three-dot
          # diff below fails with "no merge base" -- and because that failure used to be swallowed
          # by `|| true`, the manifest list came out EMPTY, the measurement loop never ran, and the
          # gate reported SUCCESS having measured nothing. A dry-run that proves nothing must never
          # look like a dry-run that passed.
          git fetch origin "$HEAD_SHA"
          mkdir -p /tmp/pr_head /tmp/pr_base
          # No `|| true`: if the diff cannot be computed, fail loudly instead of measuring nothing.
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- 'registry/*.yaml' | grep -v '/_' || true)
          echo "$changed" > /tmp/changed_manifests.txt
          if [ -z "$(tr -d '[:space:]' < /tmp/changed_manifests.txt)" ]; then
            echo "::error::dry-run-ok was applied but no changed adopted manifest was found between" \
                 "$BASE_SHA and $HEAD_SHA. Either the label was added to a PR that changes no" \
                 "manifest, or the diff could not be computed. Refusing to report success without" \
                 "measuring anything."
            exit 1
          fi
          echo "will measure: $(tr '\n' ' ' < /tmp/changed_manifests.txt)"
          for f in $changed; do
            mkdir -p "/tmp/pr_head/$(dirname "$f")" "/tmp/pr_base/$(dirname "$f")"
            # A PR that DELETES a manifest has no head blob. There is nothing to measure, and
            # without this guard `set -e` killed the whole gate on the failed `git show`.
            git show "$HEAD_SHA:$f" > "/tmp/pr_head/$f" 2>/dev/null || rm -f "/tmp/pr_head/$f"
            git show "$BASE_SHA:$f" > "/tmp/pr_base/$f" 2>/dev/null || rm -f "/tmp/pr_base/$f"
          done
      - name: Live dry-run over changed functions
        env:
          OSO_API_KEY: ${{ secrets.OSO_API_KEY }}
          OSO_ORG_ID: ${{ vars.OSO_ORG_ID }}
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
          RUN_TAG: pr${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # This gate provisions a THROWAWAY dataset per metric, so unlike observe.yml it needs the
          # source credential every time -- OSO only keeps one for a dataset that already exists.
          # Without it, every authenticated GitHub source reports "cannot be proven here", which is
          # honest but means the gate silently covers less than a reader assumes. Say so up front.
          if [ -z "${GH_API_TOKEN:-}" ]; then
            echo "::warning::GH_API_TOKEN is not set, so any metric declaring auth.secret_ref" \
                 "cannot be provisioned and will report 'cannot be proven here'. Six GitHub-sourced" \
                 "metrics are in that state. Set the repository secret to give this gate full" \
                 "coverage."
          fi
          rc=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ -f "/tmp/pr_head/$f" ] || continue   # deleted by this PR
            base_arg=""
            if [ -f "/tmp/pr_base/$f" ]; then base_arg="--base /tmp/pr_base/$f"; fi
            uv run python -m scripts.dry_run_pr "/tmp/pr_head/$f" $base_arg \
              --allowlist registry/_allowlist.txt --oso-org "$OSO_ORG_ID" \
              --run-tag "$RUN_TAG" --summary "$GITHUB_STEP_SUMMARY" || rc=1
          done < /tmp/changed_manifests.txt
          exit $rc
